# Spike 1 subworkflow — matrix over a `list` input fed by the parent's `with:`.
permissions:
  - '*'

jobs:
  workers:
    strategy:
      fail-fast: false
      matrix:
        case: ${{ inputs.cases }}
    steps:
      - name: Run case
        run: |
          echo "::notice::case=${{ matrix.case.name }} index=${PW_MATRIX_INDEX:-unset}"
          echo "CASE_DIR=${PWD}/${{ matrix.case.name }}" | tee -a $OUTPUTS

'on':
  execute:
    inputs:
      cases:
        type: list
        label: Cases
        template:
          name:
            type: string
            label: Case name
