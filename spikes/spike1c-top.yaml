# Spike 1c — fan-out fallback for computed case sets: a run step submits the
# matrix sweep as a FRESH run via the in-run pw client (values concrete at
# submission, so the matrix can expand), then polls it to completion.
permissions:
  - '*'

jobs:
  driver:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout spikes
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: optimization
          sparse_checkout:
            - spikes
      - name: Submit sweep as a fresh run and wait
        run: |
          set -x
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          cases='[{"name":"alpha"},{"name":"beta"},{"name":"gamma"}]'
          slug=$(pw workflows run "${PWD}/spikes/spike1-matrix.yaml" -i "{\"cases\": ${cases}}" -o json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['run']['slug'])")
          echo "SWEEP_SLUG=${slug}" | tee -a $OUTPUTS
          for i in $(seq 1 60); do
            status=$(pw workflows runs view "${slug}" -o json \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status') or d.get('run',{}).get('status',''))")
            echo "sweep run ${slug}: ${status}"
            case "${status}" in
              completed) exit 0 ;;
              error|canceled|faulted) echo "::error::sweep run ended ${status}"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::timed out waiting for sweep run"
          exit 1

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Resource
        autoselect: true
        optional: false
