# Spike 2 — retry-as-loop + depth-3 subworkflow nesting + file state across attempts.
# top (retried step) -> spike2-iter.yaml -> spike2-sweep.yaml -> script_submitter.
# The iteration subworkflow exits non-zero twice (driving two retries), then exits
# zero on the third pass; state lives in files under this job's own directory and
# travels as an absolute path input (no ${PW_PARENT_JOB_DIR}).
# Throwaway: lives only on the optimization branch, never merges.
permissions:
  - '*'

jobs:
  loop:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Init state
        run: |
          mkdir -p state
          echo "STATE_DIR=${PWD}/state" | tee -a $OUTPUTS
      - name: Iterate
        retry:
          max-retries: 4
          interval: 5s
        uses: github/parallelworks/workflows@optimization
        with:
          $yaml: spikes/spike2-iter.yaml
          resource: ${{ inputs.resource }}
          state_dir: ${{ needs.loop.outputs.STATE_DIR }}
      - name: Verify
        run: |
          set -x
          n=$(cat state/counter)
          ls state/
          [ "$n" = "3" ] || { echo "::error::expected 3 iterations, got $n"; exit 1; }
          for i in 1 2 3; do
            [ -f "state/sweep_${i}.done" ] || { echo "::error::missing sweep_${i}.done"; exit 1; }
          done
          echo "::notice::loop converged after $n iterations, all sweep markers present"

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Resource
        autoselect: true
        optional: false
