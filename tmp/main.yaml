jobs:
  main:
    steps:
      - name: Pick the number of workers
        id: pick
        run: echo "workers=$(( RANDOM % 9 + 2 ))" | tee -a $OUTPUTS
      - name: Run the subworkflow
        uses: github/parallelworks/workflows@tmp
        with:
          $yaml: tmp/subworkflow.yaml
          resource: ${{ inputs.resource }}
          workers: ${{ needs.main.steps.pick.outputs.workers }}
'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Resource
        optional: false
