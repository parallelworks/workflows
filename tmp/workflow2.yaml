jobs:
  pick:
    steps:
      - run: echo "workers=$(( RANDOM % 9 + 2 ))" | tee -a $OUTPUTS
  # Workflow 1's matrix expands at submission, before pick has run, so it cannot take
  # pick's output directly: one call per possible count, only the picked one runs.
  workflow1:
    needs:
      - pick
    if: ${{ matrix.workers == needs.pick.outputs.workers }}
    strategy:
      matrix:
        workers: ${{ 2 range 11 }}
    steps:
      - uses: github/parallelworks/workflows@tmp
        with:
          $yaml: tmp/workflow1.yaml
          resource: ${{ inputs.resource }}
          workers: ${{ matrix.workers }}
'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Resource
        optional: false
