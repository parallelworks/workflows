permissions:
  - '*'

env:
  RESOLUTION: ${{ inputs.resolution }}

jobs:
  install:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout Fractal Demo
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - tutorials/demo-app
      - name: Install Dependencies
        run: |
          # keep only the example directory from the sparse checkout
          mv tutorials/demo-app .
          rm -r workflow
          ./demo-app/install.sh
      - name: Create Run Script
        run: |
          # The name prefix fractal-<run-slug>- is shared by every worker in
          # this run — that is what the race keys on. The suffix must be unique
          # per worker, and two workers can target the same resource, so the
          # matrix worker index (PW_MATRIX_INDEX, set even inside this
          # subworkflow) is appended too. Unset outside the matrix.
          worker="${PW_MATRIX_INDEX:-}"
          endpoint_name="fractal-${PW_RUN_SLUG}-${{ inputs.resource.name }}${worker:+-w${worker}}"
          echo "ENDPOINT_NAME=${endpoint_name}" | tee -a $OUTPUTS
          # Every worker asks for the same subdomain. It is the page's fixed URL,
          # and the race's lock: a subdomain belongs to one endpoint at a time, so
          # the first worker to register gets it and the others are refused.
          # Empty means fractal-<your username>, folded to a valid DNS label.
          subdomain="${{ inputs.subdomain }}"
          [ -n "${subdomain}" ] || subdomain="fractal-${PW_USER}"
          subdomain=$(echo "${subdomain}" | tr '[:upper:]' '[:lower:]' | tr '_.' '--')
          echo "SUBDOMAIN=${subdomain}" | tee -a $OUTPUTS
          cat <<EOF >> script.sh
          # Everything the script needs is baked in NOW (expanded at write time):
          # the workflow-level env: does NOT reach the script_submitter subworkflow
          # that runs this script, and PW_RUN_SLUG may not be exported on a
          # compute node.
          export RESOLUTION=${{ inputs.resolution }}
          command -v pw >/dev/null 2>&1 || export PATH="\${PATH}:\${HOME}/pw"
          pw endpoints run --name ${endpoint_name} --subdomain ${subdomain} -- ${PWD}/demo-app/run.sh
          EOF
          chmod +x script.sh
          # We need to pass the PATH to the script submitter subworkflow
          echo "SCRIPT_PATH=${PWD}/script.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS
      - name: Take Over the URL
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          # An earlier run's page may still be serving at this URL, and a stopped
          # endpoint keeps its subdomain until it is deleted. Delete every endpoint
          # on the URL that is not from this run, so this run's workers can claim it.
          subdomain="${{ needs.install.outputs.SUBDOMAIN }}"
          pw endpoints list | awk -v prefix="fractal-${PW_RUN_SLUG}-" -v host="//${subdomain}." \
            'index($1, prefix) != 1 && index($3, host) > 0 { print $1 }' | while read -r old; do
            echo "::notice::Deleting endpoint ${old}, which holds ${subdomain}"
            pw endpoints delete "${old}" || true
          done


  script_submitter:
    needs:
      - install
    steps:
      - name: Script Submitter
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.install.outputs.SCRIPT_PATH }}
          scheduler: ${{ inputs.scheduler }}
          use_scheduler_agent: false
          define_cleanup_script: false
          cleanup_script_path: ''
          # Cleanups stay armed until the skip file exists (see Stage 4): a
          # LOSING worker cancels the submitter with no skip file, so its job
          # is scancel/qdel/killed; the WINNER creates the file first, so its
          # job keeps serving and the run completes.
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.install.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: ${{ inputs.slurm.is_enabled }}
            partition: ${{ inputs.slurm.partition }}
            time: ${{ inputs.slurm.time }}
            scheduler_directives: ${{ inputs.slurm.scheduler_directives }}
          pbs:
            is_enabled: ${{ inputs.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.pbs.scheduler_directives }}
      # Stage 4's guard, with one more way to get here: on the happy path this
      # job is CANCELED by first_start_wins (win or lose) before the step above
      # returns. It returns early when another worker already holds the URL (this
      # worker's pw endpoints run is refused and exits) or when the render died.
      # Stop our poller either way; a lost race ends quietly, a dead render fails
      # loud and the parent's fail-fast takes it from there.
      - name: Cancel First Start Wins
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - first_start_wins
      - name: Lost the Race or Failed
        ssh:
          remoteHost: ${{ inputs.resource.ip }}
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          holder=$(pw endpoints list | awk -v prefix="fractal-${PW_RUN_SLUG}-" -v me="${{ needs.install.outputs.ENDPOINT_NAME }}" \
            'index($1, prefix) == 1 && $1 != me { print $1; exit }')
          if [ -n "${holder}" ]; then
            echo "::notice::${holder} holds the URL — this worker lost the race"
            exit 0
          fi
          echo "::error title=Error::The fractal script exited before its endpoint came online"
          exit 1

  first_start_wins:
    needs:
      - install
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: First Start Wins
        early-cancel: any-job-failed
        retry:
          max-retries: 8640
          interval: 10s
        run: |
          command -v pw >/dev/null 2>&1 || export PATH="${PATH}:${HOME}/pw"
          # Decide whether this worker keeps its endpoint or stands down, looking
          # only at THIS run's fractal endpoints (name starts with
          # fractal-<run-slug>-). They all ask for the same subdomain, which one
          # endpoint at a time can hold, so at most one of them exists: once it
          # is running, the race is decided. Its worker wins; every other worker
          # cancels itself. permissions: ['*'] authenticates pw.
          PREFIX="fractal-${PW_RUN_SLUG}-"
          MY_NAME="${{ needs.install.outputs.ENDPOINT_NAME }}"

          holder=$(pw endpoints list | awk -v prefix="${PREFIX}" \
            'index($1, prefix) == 1 && $2 == "running" { print $1; exit }')
          echo "$(date) run=${PW_RUN_SLUG} me=${MY_NAME} holder=${holder:-<none>}"

          # No endpoint of this run holds the URL yet (or a transient empty list): keep polling.
          if [ -z "${holder}" ]; then
            echo "No endpoint of this run holds the URL yet — waiting"
            exit 1
          fi

          if [ "${holder}" = "${MY_NAME}" ]; then
            URL=$(pw endpoints list | awk -v me="${MY_NAME}" '$1 == me { print $3 }')
            echo "URL=${URL}" | tee -a $OUTPUTS
            echo "::notice::${MY_NAME} holds the URL — winner; serving at ${URL}"
            # Winner: create the skip file so the cancel below leaves the job
            # serving (Stage 4's trick). The run completes; the page stays up.
            touch ${{ needs.install.outputs.SKIP_CLEANUP_PATH }}
            sleep 2
            exit 0
          fi

          # Another worker holds the URL. No skip file for us — the cancel below
          # removes our job, queued or not.
          echo "::notice::${holder} holds the URL — ${MY_NAME} standing down"
      - name: Cancel Script Submitter
        # Winner and loser both cancel the submitter; the skip file decides what
        # that means. Winner: cleanup skipped, job keeps serving. Loser:
        # cleanups run and the job dies — the guarded delete is a defensive no-op
        # for a lingering process.
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - script_submitter
        cleanup: test -f ${{ needs.install.outputs.SKIP_CLEANUP_PATH }} || PATH="${PATH}:${HOME}/pw" pw endpoints delete "${{ needs.install.outputs.ENDPOINT_NAME }}" || true


'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Resource target
        tooltip: The compute cluster to run the fractal example on.
        autoselect: true
        optional: false
      resolution:
        type: number
        label: Resolution
        description: Image size in pixels; larger looks sharper and takes longer to render.
        default: 2500
        min: 100
        max: 10000
        step: 1
      subdomain:
        type: string
        label: URL subdomain
        description: The page is served at this subdomain, the same URL on every run. Empty means fractal-<your username>.
        tooltip: A run takes the URL over — an earlier run's page still serving there is deleted.
        optional: true
      scheduler:
        type: boolean
        default: false
        label: Submit to the scheduler
        description: Otherwise the job runs on the login node.
        hidden: ${{ inputs.resource.schedulerType == '' }}
        ignore: ${{ .hidden }}
      slurm:
        type: group
        label: SLURM directives
        hidden: ${{ inputs.resource.schedulerType != 'slurm' || inputs.scheduler == false }}
        ignore: ${{ inputs.resource.schedulerType != 'slurm' || inputs.scheduler == false }}
        items:
          is_enabled:
            type: boolean
            hidden: true
            default: true
            label: Is SLURM Enabled? Yes, unless the slurm section is hidden and ignored
          partition:
            type: slurm-partitions
            label: SLURM partition
            optional: true
            resource: ${{ inputs.resource }}
          time:
            label: Walltime
            description: HH:MM:SS, or D-HH:MM:SS for runs over a day.
            type: string
            default: '00:30:00'
            tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
          scheduler_directives:
            type: editor
            label: Scheduler directives
            optional: true
            tooltip: |
              Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
              #SBATCH --exclusive
              #SBATCH --nodelist=<node-name>
      pbs:
        type: group
        label: PBS directives
        hidden: ${{ inputs.resource.schedulerType != 'pbs' || inputs.scheduler == false }}
        ignore: ${{ inputs.resource.schedulerType != 'pbs' || inputs.scheduler == false }}
        items:
          is_enabled:
            type: boolean
            hidden: true
            default: true
            label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
          scheduler_directives:
            label: Scheduler directives
            type: editor
            tooltip: |
              Add extra PBS directives, one per line, using the #PBS prefix. For example:
              #PBS -l walltime=01:00:00
              #PBS -l mem=16gb
