# One Dakota-OpenFOAM optimization iteration of the planar-expansion study,
# invoked as a subworkflow by general.yaml's retried Iterate step. Its exit
# status IS the loop control: completing tells the parent the loop is over
# (converged or failed — the parent reads state/status to know which); failing
# tells the parent's retry to fire the next iteration. The pattern and file
# contract come from tutorials/optimization.
#
# The two compute pieces are the standalone workflows, called as subworkflows:
#   optimize  ->  workflows/dakota/yamls/general.yaml                  (one optimizer step)
#   workers   ->  workflows/openfoam-expansion/yamls/general.yaml      (one case per design)
# They meet in the files of the state directory: the Dakota step leaves one
# iter_<N>/case_<j>/params.in per proposed design, each OpenFOAM call takes that
# file as its design and that directory as its case directory, and leaves
# results.out (or exit_code) there for the next Dakota step to ingest.
permissions:
  - '*'

jobs:
  # Run the optimizer step: ingest the previous generation's results.out files,
  # then either propose the next generation (status CONTINUE, N_CASES > 0) or
  # stop (CONVERGED/FAILED, N_CASES = 0). The scalars the rest of this iteration
  # needs are read back from the proposal.env the step writes under state_dir.
  optimize:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Dakota (Propose or Stop)
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/dakota/yamls/general.yaml
          resource: ${{ inputs.resource }}
          problem:
            variables: ${{ inputs.variables }}
            objectives: ${{ inputs.objectives }}
          optimizer:
            state_dir: ${{ inputs.state_dir }}
            batch_size: ${{ inputs.batch_size }}
            max_generations: ${{ inputs.max_iterations }}
            stall_generations: ${{ inputs.stall_generations }}
            seed: ${{ inputs.seed }}
          software:
            dakota_load: ${{ inputs.dakota_load }}
      - name: Publish the Proposal
        run: |
          tee -a $OUTPUTS < "${{ inputs.state_dir }}/proposal.env"
          source "${{ inputs.state_dir }}/proposal.env"
          echo "::notice::Iterate attempt $(( ${{ inputs.attempt }} + 1 )) of $(( ${{ inputs.max_iterations }} + 1 )): generation ${GENERATION}, status ${STATUS}, ${N_CASES} cases to evaluate"
      # A proposal wider than the matrix below would silently evaluate only the
      # first batch_size cases — fail loud instead. A persistent violation ends as
      # FAILED: the retried attempts find the generation without results and escalate.
      - name: Check the Proposal Fits the Matrix
        run: |
          n="${{ needs.optimize.outputs.N_CASES }}"
          if [ "${n}" -gt "${{ inputs.batch_size }}" ]; then
            echo "::error::the optimizer proposed ${n} cases but the workers matrix has ${{ inputs.batch_size }} slots (batch_size); fix the optimizer"
            exit 1
          fi

  # The guarded matrix: a matrix can only expand over values that are concrete
  # at submission, so it ranges over batch_size (a form input): slots
  # 1..batch_size, and the job-level if: compares each slot against the runtime
  # output N_CASES — surplus workers are skipped (Dakota often proposes fewer
  # than batch_size new points per generation), and when the optimizer stops
  # (N_CASES=0) every worker is skipped, so convergence costs nothing. Each live
  # slot is one call of the standalone expansion evaluator, exactly as it runs
  # from the platform by itself: its params_file carries the design (the three
  # wall-transition names), and the run settings — reynolds, the channel lengths,
  # the loss planes, the mesh scale — pass through as case fields, so every
  # design of every generation is solved on the same problem.
  workers:
    needs: [optimize]
    strategy:
      fail-fast: false
      matrix:
        job_id: ${{ 1 range inputs.batch_size + 1 }}
    if: ${{ matrix.job_id <= needs.optimize.outputs.N_CASES }}
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: OpenFOAM (Evaluate the Design)
        uses: github/parallelworks/workflows@expansion
        with:
          $yaml: workflows/openfoam-expansion/yamls/general.yaml
          resource: ${{ inputs.resource }}
          cluster:
            scheduler: ${{ inputs.scheduler }}
            slurm:
              is_enabled: ${{ inputs.slurm.is_enabled }}
              partition: ${{ inputs.slurm.partition }}
              time: ${{ inputs.slurm.time }}
              scheduler_directives: ${{ inputs.slurm.scheduler_directives }}
            pbs:
              is_enabled: ${{ inputs.pbs.is_enabled }}
              scheduler_directives: ${{ inputs.pbs.scheduler_directives }}
          case:
            params_file: ${{ needs.optimize.outputs.ITER_DIR }}/case_${{ matrix.job_id }}/params.in
            case_dir: ${{ needs.optimize.outputs.ITER_DIR }}/case_${{ matrix.job_id }}
            reynolds: ${{ inputs.reynolds }}
            inlet_length: ${{ inputs.inlet_length }}
            plane_in: ${{ inputs.plane_in }}
            plane_out: ${{ inputs.plane_out }}
            mesh_scale: ${{ inputs.mesh_scale }}
          software:
            openfoam_load: ${{ inputs.openfoam_load }}

  # if: always — this job must reach its verdict even when optimize crashed or a
  # worker failed: any non-CONVERGED/FAILED state exits 1, which fails this run and
  # makes the parent's retry re-enter the loop (a crashed attempt re-runs the same
  # iteration off the state files — self-healing).
  decide:
    needs: [optimize, workers]
    if: ${{ always }}
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Continue or Stop
        run: |
          status=$(cat "${{ inputs.state_dir }}/status" 2>/dev/null || echo MISSING)
          case "${status}" in
            CONVERGED|FAILED)
              echo "::notice::loop ends with status ${status}"
              ;;
            *)
              echo "::notice::status ${status}: exit 1 so the parent retry fires the next iteration"
              exit 1
              ;;
          esac

'on':
  execute:
    inputs:
      attempt:
        type: number
        label: Attempt of the parent's retried Iterate step (0-based)
        default: 0
        min: 0
      resource:
        type: compute-clusters
        label: Resource
        optional: false
      scheduler:
        type: boolean
        label: Schedule cases?
        default: false
      slurm:
        type: group
        label: SLURM directives
        items:
          is_enabled:
            type: boolean
            hidden: true
            default: true
            label: Is SLURM enabled?
          partition:
            type: string
            label: SLURM partition
            optional: true
          time:
            type: string
            label: Walltime
            default: '01:00:00'
          scheduler_directives:
            type: editor
            label: Scheduler directives
            optional: true
      pbs:
        type: group
        label: PBS directives
        items:
          is_enabled:
            type: boolean
            hidden: true
            default: true
            label: Is PBS enabled?
          scheduler_directives:
            type: editor
            label: Scheduler directives
            optional: true
      batch_size:
        type: number
        label: Cases per iteration
        default: 4
        min: 1
        max: 8
      max_iterations:
        type: number
        label: Generation budget
        default: 10
        min: 1
      stall_generations:
        type: number
        label: Stagnation window
        default: 3
        min: 1
      seed:
        type: number
        label: Dakota seed
        default: 4242
        min: 1
      mesh_scale:
        type: number
        label: Mesh resolution multiplier
        default: 1
        min: 1
        max: 6
      reynolds:
        type: number
        label: Reynolds number
        default: 300
        min: 50
        max: 800
      inlet_length:
        type: number
        label: Inlet length (h)
        default: 5
        min: 1
        max: 20
      plane_in:
        type: number
        label: Inlet loss plane (h)
        default: -2
        min: -20
        max: -0.1
      plane_out:
        type: number
        label: Outlet loss plane (h)
        default: 40
        min: 1
        max: 59
      variables:
        type: editor
        label: Design variables and bounds (one "<name> <lower> <upper>" per line)
        default: |
          transition_length  0.5  10
          top_rounding       0.0  0.9
          bottom_rounding    0.0  0.9
      objectives:
        type: string
        label: Objectives (both minimized)
        default: loss_coefficient neg_min_wall_shear
      openfoam_load:
        type: editor
        label: OpenFOAM environment commands (empty = conda-forge install)
        optional: true
      dakota_load:
        type: editor
        label: Dakota environment commands (empty = conda-forge install)
        optional: true
      state_dir:
        type: string
        label: Absolute path of the optimizer state directory
