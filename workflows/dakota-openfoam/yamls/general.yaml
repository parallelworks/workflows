# Dakota-driven OpenFOAM airfoil shape optimization: Dakota's MOGA proposes
# batches of NACA 4-digit designs (camber, camber position, thickness), the
# platform evaluates each as a parallel OpenFOAM case (C-grid, simpleFoam,
# min drag / max lift from forceCoeffs), and the loop repeats until Dakota
# converges or the budget runs out. Built on the pattern from
# tutorials/optimization (retry-as-loop + guarded static matrix); the swap the
# tutorial's README describes, made real. Preprocessing prepares one sourceable
# environment file per tool: the load commands typed in the form (module load,
# source .../bashrc) or, when none are given, the conda-forge install made by the
# app's idempotent install scripts. Cases run serially or, with cores_per_case > 1,
# decomposed under mpirun.
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Checkout Dakota-OpenFOAM App
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/dakota-openfoam/app
      - name: Validate Inputs and Initialize State
        run: |
          set -e
          batch="${{ inputs.optimizer.batch_size }}"
          # 8 = the width of the static matrix in iteration.yaml; a matrix cannot
          # expand over runtime values, so the cap is hardcoded there
          if [ "${batch}" -lt 1 ] || [ "${batch}" -gt 8 ]; then
            echo "::error::batch_size ${batch} is out of range 1-8. To raise the cap, extend the job_id list in iteration.yaml."
            exit 1
          fi
          cores="${{ inputs.cluster.cores_per_case }}"
          if ! [[ "${cores}" =~ ^[0-9]+$ ]] || [ "${cores}" -lt 1 ]; then
            echo "::error::cores_per_case must be a positive integer, got '${cores}'"
            exit 1
          fi
          mkdir -p state
          echo "STATE_DIR=${PWD}/state" | tee -a $OUTPUTS
          echo "APP_DIR=${PWD}/workflows/dakota-openfoam/app" | tee -a $OUTPUTS
      # each environment is one file later steps and every case source; the heredoc
      # carries the form's load commands verbatim (empty -> conda-forge install)
      - name: Prepare the OpenFOAM Environment
        run: |
          set -e
          required="blockMesh potentialFoam simpleFoam"
          if [ "${{ inputs.cluster.cores_per_case }}" -gt 1 ]; then
            required="${required} decomposePar mpirun"
          fi
          bash workflows/dakota-openfoam/app/prepare-env.sh openfoam "${PWD}/state/openfoam-env.sh" ${required} << 'PW_LOAD_EOF'
          ${{ inputs.software.openfoam_load }}
          PW_LOAD_EOF
          echo "OPENFOAM_ENV=${PWD}/state/openfoam-env.sh" | tee -a $OUTPUTS
      - name: Prepare the Dakota Environment
        run: |
          set -e
          bash workflows/dakota-openfoam/app/prepare-env.sh dakota "${PWD}/state/dakota-env.sh" dakota << 'PW_LOAD_EOF'
          ${{ inputs.software.dakota_load }}
          PW_LOAD_EOF
          echo "DAKOTA_ENV=${PWD}/state/dakota-env.sh" | tee -a $OUTPUTS

  optimization_loop:
    needs: [preprocessing]
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      # retry-as-loop: iteration.yaml exits 1 while Dakota wants another
      # generation, and each retry attempt re-invokes it fresh. max-retries is the
      # loop budget: max_iterations proposal cycles + the final converging call.
      # Attempt != iteration — a crashed attempt re-runs the same iteration off the
      # state files and consumes budget. Only the LAST attempt's logs surface here;
      # per-iteration history lives under state/ and in ::notice lines.
      - name: Iterate
        retry:
          max-retries: ${{ inputs.optimizer.max_iterations }}
          interval: 10s
          # retry.timeout defaults to 30s (docs: building-workflows/yaml-fields)
          # and cancels the whole attempt — every job of the iteration
          # subworkflow, mid-simulation — when it expires. One generation
          # (propose + node boot + queue + solve + decide) must fit in it.
          timeout: ${{ inputs.optimizer.iteration_timeout }}
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/dakota-openfoam/yamls/iteration.yaml
          resource: ${{ inputs.cluster.resource }}
          scheduler: ${{ inputs.cluster.scheduler }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            time: ${{ inputs.cluster.slurm.time }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
          batch_size: ${{ inputs.optimizer.batch_size }}
          max_iterations: ${{ inputs.optimizer.max_iterations }}
          stall_generations: ${{ inputs.optimizer.stall_generations }}
          mesh_scale: ${{ inputs.optimizer.mesh_scale }}
          cores_per_case: ${{ inputs.cluster.cores_per_case }}
          openfoam_env: ${{ needs.preprocessing.outputs.OPENFOAM_ENV }}
          dakota_env: ${{ needs.preprocessing.outputs.DAKOTA_ENV }}
          state_dir: ${{ needs.preprocessing.outputs.STATE_DIR }}
          app_dir: ${{ needs.preprocessing.outputs.APP_DIR }}
      # if: always — the run's verdict comes from the state files, not from how the
      # Iterate step ended: CONVERGED is the only success, whether the loop stopped
      # by decision (Iterate succeeded) or by exhausting its retries (Iterate failed).
      - name: Report
        if: ${{ always }}
        run: |
          state="${{ needs.preprocessing.outputs.STATE_DIR }}"
          status=$(cat "${state}/status" 2>/dev/null || echo MISSING)
          case "${status}" in
            CONVERGED)
              n=$(($(wc -l < "${state}/pareto.csv") - 1))
              echo "::notice::optimization converged: ${n} non-dominated designs in ${state}/pareto.csv, plotted in ${state}/pareto.svg"
              head -15 "${state}/pareto.csv"
              ;;
            FAILED)
              echo "::error::the optimizer declared FAILED: no case of a generation ran twice in a row, every case failed before any design succeeded or for three generations running, or Dakota exited without proposing or converging. Check the last attempt's worker logs, ${state}/iter_*/case_*/{run.*.out,case/log.*} and ${state}/dakota/dakota.log"
              exit 1
              ;;
            CONTINUE)
              echo "::error::loop budget exhausted before convergence: all retries of the Iterate step were used while the optimizer still wanted to continue. Raise max_iterations (crashed attempts also consume budget) or loosen the convergence knobs."
              exit 1
              ;;
            *)
              echo "::error::no ${state}/status file: the first iteration never reached its optimize step. Read the Iterate attempt logs."
              exit 1
              ;;
          esac

'on':
  execute:
    inputs:
      cluster:
        type: group
        label: Compute Cluster Settings
        items:
          resource:
            type: compute-clusters
            label: Compute resource
            include-workspace: false
            tooltip: Resource where Dakota and all OpenFOAM cases run
          scheduler:
            type: boolean
            default: false
            label: Schedule Cases?
            hidden: ${{ inputs.cluster.resource.schedulerType == '' }}
            ignore: ${{ .hidden }}
            tooltip: |
              Yes → Each OpenFOAM case is submitted to the scheduler using sbatch, qsub, etc
              No  → Cases run on the controller or login node instead
          cores_per_case:
            type: number
            label: Cores per case
            default: 1
            min: 1
            max: 64
            tooltip: |
              MPI ranks per OpenFOAM case. 1 runs the solvers serially; more
              decomposes the mesh into N strips and runs potentialFoam and
              simpleFoam under mpirun. Only pays off from mesh_scale 3-4 (2-4 ranks): at the
              default mesh a decomposed case is slower than a serial one. Scheduled
              cases request --nodes=1 --ntasks=N (PBS: select=1:ncpus=N:mpiprocs=N),
              so N must fit one node; on the login node, batch_size x N ranks run
              at once.
          slurm:
            type: group
            label: SLURM Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.cluster.resource }}
                tooltip: Select a partition from the drop down menu.
              time:
                label: Walltime per case
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for each case'
              scheduler_directives:
                type: editor
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
                  The workflow already sets --nodes=1 and --ntasks from Cores per case;
                  a directive here repeating one of them takes precedence.
          pbs:
            type: group
            label: PBS Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler Directives
                type: editor
                optional: true
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1
                  The workflow already sets -l select=1:ncpus=N:mpiprocs=N from Cores per case.
      optimizer:
        type: group
        label: Optimizer Settings
        items:
          max_iterations:
            type: number
            label: Maximum iterations
            default: 10
            min: 1
            max: 50
            tooltip: |
              Generation budget: the loop stops with the front found so far after
              this many evaluated generations, even if Dakota wants to continue.
              Also the loop's retry budget, so a crashed-and-retried iteration
              consumes one.
          batch_size:
            type: number
            label: Cases per iteration
            default: 4
            min: 1
            max: 8
            tooltip: |
              OpenFOAM cases evaluated in parallel each iteration (Dakota MOGA's
              population size). Capped by the matrix width hardcoded in
              iteration.yaml. Dakota may propose fewer new points in a generation;
              surplus worker slots are skipped for free.
          stall_generations:
            type: number
            label: Stagnation window
            default: 3
            min: 1
            max: 20
            tooltip: |
              Declare convergence when the Pareto front's normalized hypervolume
              improves by less than 0.001 over this many consecutive generations.
              Dakota's own MOGA convergence criteria also end the loop.
          mesh_scale:
            type: number
            label: Mesh resolution multiplier
            default: 1
            min: 1
            max: 6
            tooltip: |
              The cost dial: multiplies every cell count of the C-grid around the
              airfoil, and the solver's iteration budget scales with it, so cost
              grows roughly with the cube: ~10 s per case at 1, ~1 min at 2,
              ~10 min at 4, ~35 min at 6 (one core). The mesh is essentially
              converged by 3-4; the README has the measured accuracy table.
          iteration_timeout:
            type: string
            label: Time budget per iteration
            default: 2d
            tooltip: |
              Maximum wall time for one generation: propose + evaluate every case
              (including scheduler queue and node boot) + decide. Units like 30s,
              10m, 12h, 2d. The generous default means it only trips on a genuinely
              stuck iteration, which is then canceled and retried (consuming
              budget); tighten it if you want faster failure detection.
      software:
        type: group
        label: Software Environment
        collapsed: true
        items:
          openfoam_load:
            type: editor
            label: OpenFOAM environment commands
            optional: true
            tooltip: |
              Shell commands that put blockMesh, potentialFoam and simpleFoam (and
              decomposePar plus mpirun when Cores per case > 1) on PATH, one per
              line, e.g. `module load openfoam/2412` or `source
              /opt/openfoam2412/etc/bashrc`. Leave empty to install OpenFOAM v2412
              from conda-forge (no sudo, ~5 min once) under
              ${service_parent_install_dir:-$HOME/pw/software}/dakota-openfoam.
              Every case sources these commands; `export MPIRUN="srun --mpi=pmix"`
              here replaces the default launcher `mpirun --bind-to none -np N`.
          dakota_load:
            type: editor
            label: Dakota environment commands
            optional: true
            tooltip: |
              Shell commands that put `dakota` on PATH, e.g. `module load dakota`.
              Leave empty to install Dakota 6.16 from conda-forge next to OpenFOAM.
