<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Dask on SLURM: a scheduler feeding three SLURM worker jobs, the task
       stream between them. Source of dask-slurm.png (rendered at 120 px, the
       size of the marketplace thumbnails), so three shapes, one accent. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2567b8"/>
      <stop offset="1" stop-color="#153f7d"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="88" fill="url(#bg)"/>

  <!-- the scheduler -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round">
    <rect x="166" y="72" width="180" height="92" rx="16"/>
  </g>
  <g fill="#8fe0ff">
    <rect x="190" y="96" width="132" height="12" rx="6"/>
    <rect x="190" y="122" width="88" height="12" rx="6"/>
  </g>

  <!-- the task stream to the workers -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256,164 L256,214 L116,214 L116,284"/>
    <path d="M256,214 L256,284"/>
    <path d="M256,214 L396,214 L396,284"/>
  </g>
  <g fill="#8fe0ff">
    <rect x="98" y="232" width="36" height="36" rx="8"/>
    <rect x="238" y="232" width="36" height="36" rx="8"/>
    <rect x="378" y="232" width="36" height="36" rx="8"/>
  </g>
  <g fill="#ffffff">
    <path d="M100,268 L116,296 L132,268 z"/>
    <path d="M240,268 L256,296 L272,268 z"/>
    <path d="M380,268 L396,296 L412,268 z"/>
  </g>

  <!-- three worker jobs -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round">
    <rect x="56" y="316" width="120" height="124" rx="16"/>
    <rect x="196" y="316" width="120" height="124" rx="16"/>
    <rect x="336" y="316" width="120" height="124" rx="16"/>
  </g>
  <g fill="#8fe0ff">
    <rect x="80" y="342" width="72" height="12" rx="6"/>
    <rect x="80" y="368" width="72" height="12" rx="6"/>
    <rect x="80" y="394" width="44" height="12" rx="6"/>
    <rect x="220" y="342" width="72" height="12" rx="6"/>
    <rect x="220" y="368" width="72" height="12" rx="6"/>
    <rect x="220" y="394" width="44" height="12" rx="6"/>
    <rect x="360" y="342" width="72" height="12" rx="6"/>
    <rect x="360" y="368" width="72" height="12" rx="6"/>
    <rect x="360" y="394" width="44" height="12" rx="6"/>
  </g>
</svg>
