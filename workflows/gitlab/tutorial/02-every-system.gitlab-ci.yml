# Step 3 of the tutorial: one job definition, run once per ACTIVATE resource.
# The shell runner on the login node drives the other systems with the pw CLI,
# signed in with the ACTIVATE API key the workflow was launched with (or, on a
# cluster connected through the ACTIVATE agent, the login node's own sign-in).

submit-everywhere:
  tags: [shell]                    # the shell runner: pw runs on the login node
  # "parallel: matrix:" turns this one definition into one job per entry, each
  # with the entry's variables set. One entry per system: its name as
  # `pw cluster ls` prints it (the part after pw://<user>/; it must be on) and
  # the sbatch options that system requires (replace them: --account=<account>,
  # --partition=<partition>, --qos=<qos>, ... as the system demands).
  parallel:
    matrix:
      - RESOURCE: "<resource_1>"
        SBATCH_OPTIONS: "--nodes=1 --time=00:10:00"
      - RESOURCE: "<resource_2>"
        SBATCH_OPTIONS: "--nodes=1 --time=00:10:00"
  script:
    - export PATH="$HOME/pw:$PATH"
    - pw auth whoami                 # who pw is signed in as
    - pw cluster ls | grep "$RESOURCE"
    # Submit a batch job on the resource, wait for it, and read its output back.
    # The outer double quotes expand $SBATCH_OPTIONS and $CI_JOB_ID here; the
    # inner single quotes keep the job's commands for the resource.
    - pw ssh "$RESOURCE" "sbatch --wait $SBATCH_OPTIONS --job-name=ci-$CI_JOB_ID --output=ci-$CI_JOB_ID.out --wrap='hostname; nproc; date' && cat ci-$CI_JOB_ID.out"
