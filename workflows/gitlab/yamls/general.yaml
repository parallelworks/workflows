# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/gitlab/lib
            - workflows/gitlab/gitlab-singularity
            - workflows/gitlab/gitlab-docker
            - tools/oras
      - name: Create Inputs
        run: |
          set -x
          # Write PW environment variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # Secrets and the multi-line license go into their own mode-600 files
          umask 077
          cat <<'EOF' > root-password.txt
          ${{ inputs.service.root_password }}
          EOF
          cat <<'EOF' > oidc-client-secret.txt
          ${{ inputs.oidc.client_secret }}
          EOF
          cat <<'EOF' > license.gitlab-license
          ${{ inputs.service.license }}
          EOF
          cat <<'EOF' > runner-token.txt
          ${{ inputs.runners.token }}
          EOF
          for f in root-password.txt oidc-client-secret.txt license.gitlab-license runner-token.txt; do
            tr -d '\r' < "$f" | sed '/^[[:space:]]*$/d; /^undefined$/d' > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          umask 022
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          mode="${{ inputs.mode }}"
          service_rundir="${{ inputs.service.rundir }}"
          service_parent_install_dir="${{ inputs.service.parent_install_dir }}"
          service_subdomain="${{ inputs.service.subdomain }}"
          service_image="${{ inputs.service.image }}"
          service_ssh_port="${{ inputs.service.ssh_port }}"
          service_root_password_file="${PW_PARENT_JOB_DIR}/root-password.txt"
          service_license_file="${PW_PARENT_JOB_DIR}/license.gitlab-license"
          runners_shell="${{ inputs.runners.shell }}"
          runners_slurm="${{ inputs.runners.slurm }}"
          runners_group="${{ inputs.runners.group }}"
          runners_gitlab_url="${{ inputs.runners.gitlab_url }}"
          runners_path="${{ inputs.runners.path }}"
          runners_rundir="${{ inputs.runners.rundir }}"
          runners_token_file="${PW_PARENT_JOB_DIR}/runner-token.txt"
          oidc_client_id="${{ inputs.oidc.client_id }}"
          oidc_client_secret_file="${PW_PARENT_JOB_DIR}/oidc-client-secret.txt"
          oidc_block_new_users="${{ inputs.oidc.block_new_users }}"
          oidc_display_name="${{ inputs.oidc.display_name }}"
          EOF
          # Remove empty and undefined variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          # Add export to all lines
          sed -i 's/^/export /' inputs.sh
      - name: Controller Preprocessing
        run: mode="${{ inputs.mode }}" container_runtime="${{ inputs.service.container_runtime }}" bash workflows/gitlab/lib/preprocess.sh controller
      - name: Create Service Script
        run: mode="${{ inputs.mode }}" container_runtime="${{ inputs.service.container_runtime }}" service_name="${{ inputs.service.name }}" bash workflows/gitlab/lib/preprocess.sh service-script

  session_runner:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          # GitLab and the runners always run where preprocessing did: a service
          # that outlives the run cannot live in a scheduler allocation
          scheduler: false
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: false
          pbs:
            is_enabled: false
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::Session runner failed before the endpoint came online"
          exit 1

  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: ${{ needs.preprocessing.outputs.ENDPOINT_NAME }}
          host: ${{ inputs.resource.ip }}
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          path: ${{ needs.preprocessing.outputs.HEALTH_PATH }}
          healthy: '2*'
          budget: 1800
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Service host
        description: GitLab, or the runners you add to one, run on this cluster's login node.
        include-workspace: false
      mode:
        type: dropdown
        label: What to start
        description: Start GitLab serves a GitLab of your own with runners for your projects; Add my runners registers runners of yours with a GitLab another user started on this cluster, so that your pipelines run as you.
        default: gitlab
        options:
          - label: Start GitLab
            value: gitlab
          - label: Add my runners to a running GitLab
            value: runner
        tooltip: |
          A GitLab started here runs CI jobs as the user who launched it, so its runners only serve the group that user owns. Every other user who signs in to that GitLab (with ACTIVATE) and wants pipelines launches this workflow on the same cluster with "Add my runners": the runners then run their projects' jobs as them, with their own cluster account and credentials, from their own runner directory.
      service:
        type: group
        label: GitLab settings
        collapsed: true
        hidden: ${{ inputs.mode == 'runner' }}
        ignore: ${{ .hidden }}
        items:
          name:
            type: string
            hidden: true
            default: gitlab
          container_runtime:
            type: dropdown
            label: Run container using
            description: Singularity runs the GitLab image as your user, with no root or user namespace; Docker runs it as root.
            default: gitlab-singularity
            options:
              - label: Singularity
                value: gitlab-singularity
              - label: Docker
                value: gitlab-docker
            tooltip: |
              Singularity: the official image rebuilt to run as one unprivileged user (ghcr.io/parallelworks/gitlab, one SIF), run as an Apptainer or Singularity instance with no root, fakeroot or writable layer, so it works wherever the runtime runs at all and the run directory can be on a network filesystem (NFS, Lustre). Docker: the official image (needs Docker, directly or through sudo); its run directory is written as root. A run directory belongs to one runtime.
          subdomain:
            label: Subdomain
            description: Label of the URL, https://<label>.<sessions domain>, the same on every run; empty uses gitlab-<your username>.
            type: string
            optional: true
            default: gitlab
            tooltip: |
              GitLab builds its clone URLs and the Sign in with ACTIVATE redirect URI from this address, so it is pinned instead of taking a random subdomain. Lowercase letters, digits and dashes; reserve it with 'pw subdomains reserve <label>' so nobody else takes it. Two GitLabs of yours (two clusters) need two labels.
          rundir:
            label: Run directory
            description: Keeps the repositories, database and settings; reuse it to keep them, delete it to start over, put it on a persistent disk to keep them across cluster restarts. A run directory belongs to one runtime.
            type: string
            default: ${HOME}/gitlab
            tooltip: |
              Holds config/ (gitlab.rb, secrets), data/ (repositories, PostgreSQL, uploads, and under .rootless/ what the package writes into its install directory), logs/ and runner/ (the CI runners' configuration and builds); under Singularity also work/ (the container's /tmp). Singularity writes everything as your user (rm -rf removes it); Docker writes config/, data/ and logs/ as root (sudo rm -rf). One GitLab per run directory at a time; the first start of a run directory takes several minutes (database setup). On a cloud cluster, put it on a persistent disk attached to the cluster (/gitlab/gitlab for a disk mounted at /gitlab): the data then outlives a stop or re-creation of the cluster, and after a restart you delete the stopped session and launch again on the same directory.
          image:
            label: GitLab image
            description: Docker only; keep the major version of an existing run directory. gitlab/gitlab-ce is the open-source Community Edition, which takes no license.
            type: string
            default: gitlab/gitlab-ee:19.5.1-ee.0
            hidden: ${{ inputs.service.container_runtime == 'gitlab-singularity' }}
            ignore: ${{ .hidden }}
            tooltip: |
              The official all-in-one Linux package image (Puma, Sidekiq, Gitaly, PostgreSQL, Redis, nginx). gitlab/gitlab-ee runs the Free tier without a license and takes a Premium or Ultimate license; gitlab/gitlab-ce is the MIT-licensed edition. GitLab upgrades one minor version at a time (see its upgrade path), so change the tag in steps. The Singularity runtime uses the prebuilt ghcr.io/parallelworks/gitlab image instead.
          root_password:
            label: Root password
            description: Initial password of the root account, 8 characters or more, applied on the first start of a run directory only; empty generates one, saved to <run directory>/.root_password.
            type: password
            optional: true
          ssh_port:
            label: SSH port
            description: Loopback port of GitLab's SSH on the service host; reach it from your machine with 'pw forward -L <port>:localhost:<port> <cluster>'.
            type: number
            default: 2222
            min: 1024
            max: 65535
            step: 1
            tooltip: |
              The platform endpoint only serves HTTPS pages, and the platform's sign-in stands in front of it, so git clone, push and pull from your machine go through a pw forward tunnel to this port (SSH) or to the HTTP port the run logs print; from the cluster itself use http://localhost:<HTTP port>. GitLab's SSH clone URLs show this port.
          license:
            label: GitLab license
            description: Contents of a .gitlab-license file (Premium, Ultimate or a trial), applied once; empty runs the Free tier, which includes Sign in with ACTIVATE and the CI/CD runners.
            type: editor
            optional: true
            tooltip: |
              Paste the whole license key (the long base64 block). It needs the gitlab-ee image; the Community Edition takes no license. GitLab remembers it in the run directory, so later runs may leave this empty; a new key replaces the current one. Add or change a license later under Admin -> Settings -> General -> Add License.
          parent_install_dir:
            type: string
            hidden: true
            default: ${HOME}/pw/software
      runners:
        type: group
        label: CI/CD runners
        description: Runners of yours on the service host; every job they take runs as you, with your cluster account, so only your projects can use them.
        collapsed: true
        items:
          gitlab_url:
            label: GitLab address
            description: The https://... address of the GitLab in your browser, started on this cluster with this workflow and shared with you; the default is where this workflow serves it unless its owner chose another subdomain.
            type: string
            default: https://gitlab.activate.pw
            hidden: ${{ inputs.mode != 'runner' }}
            ignore: ${{ .hidden }}
            tooltip: |
              The GitLab's session must be shared with you (its owner shares it from the platform's sessions page) and its run must have completed. The runners reach the GitLab on the login node's loopback port, which the workflow asks the GitLab for through this address; they cannot work from another cluster.
          token:
            label: GitLab personal access token
            description: A token of your GitLab account with the api and create_runner scopes, used to register the runners; give it a short expiry, since the platform keeps form values in the run's record. A later start of the same runner directory needs none.
            type: password
            optional: true
            hidden: ${{ inputs.mode != 'runner' }}
            ignore: ${{ .hidden }}
            tooltip: |
              In GitLab, your avatar -> Edit profile -> Access tokens -> Add new token: a Legacy token (not a fine-grained one), scopes api and create_runner, an expiry of a day; GitLab shows it once. The token looks the project or group up and creates the runners; the runners' own tokens stay in the runner directory, and a runner whose stored token no longer works is registered again with a new token given here.
          path:
            label: Project or group
            description: Full path of the GitLab project, namespace included (jane/hpc-pipeline, not hpc-pipeline), or of the group (team-a), whose pipelines run on these runners; you must be a Maintainer of the project or an Owner of the group.
            type: string
            hidden: ${{ inputs.mode != 'runner' }}
            ignore: ${{ .hidden }}
            tooltip: |
              The path is everything after the GitLab address in your browser with the project or group open: <username or group>/<project> for a project, <group> for a group. A project name on its own is not found. The runners are registered as runners of that project or group only (project or group runners), so no other project can run a job as you; share the project with care, since a commit anyone pushes to it runs as you.
          rundir:
            label: Runner directory
            description: Keeps the runners' registration, configuration, checkouts and cache; reuse it to keep them, delete it to register anew.
            type: string
            default: ${HOME}/gitlab-runner
            hidden: ${{ inputs.mode != 'runner' }}
            ignore: ${{ .hidden }}
            tooltip: |
              Holds tokens/ (the runners' authentication tokens), config.toml, builds/ and cache/ (the jobs' checkouts), runner.log and, for the SLURM runner, jacamar/ and jacamar.toml; all readable by you alone. One set of runners per directory at a time; runners for two GitLabs or two projects take two directories.
          group:
            label: Group of the runners
            description: GitLab group whose projects run their pipelines on these runners, created on the first start with you as its Owner; empty names it <your username>-ci.
            type: string
            optional: true
            hidden: ${{ inputs.mode == 'runner' }}
            ignore: ${{ .hidden }}
            tooltip: |
              The runners are group runners: a project outside the group cannot use them, so a user you share the GitLab with cannot run a job as you. Create your projects in the group, or move them there (the project's Settings -> General -> Advanced -> Transfer project). A group of this path that exists already is used as is. With Sign in with ACTIVATE configured, your GitLab account is created ahead of your first sign-in and made the group's Owner; without it, root owns the group.
          shell:
            type: boolean
            default: true
            label: Register a shell runner
            description: Runs CI jobs directly on the service host (shell executor) as you; it takes untagged jobs.
          slurm:
            type: boolean
            default: false
            label: Register a SLURM runner
            description: Submits each CI job to the cluster's scheduler as you with Jacamar CI; jobs select it with the tag slurm and pass sbatch options in the SCHEDULER_PARAMETERS variable.
            hidden: ${{ inputs.resource.schedulerType != 'slurm' }}
            ignore: ${{ .hidden }}
            tooltip: |
              The runner uses GitLab's custom executor with Jacamar CI (ECP): the job's before_script and script run inside an sbatch job submitted as you from the service host, after_script on the service host. A job sets SCHEDULER_PARAMETERS to the sbatch options it needs, for example "--nodes=1 --time=00:10:00" plus the account, partition or QoS the cluster requires; -o, -e, -J and --wait are reserved by Jacamar. Jobs wait for the allocation inside GitLab's job timeout.
      oidc:
        type: group
        label: Sign in with ACTIVATE
        description: Lets users sign in to GitLab with their ACTIVATE account; a client ID reveals the secret and the approval fields. Leave it empty for GitLab's own accounts only.
        collapsed: true
        hidden: ${{ inputs.mode == 'runner' }}
        ignore: ${{ .hidden }}
        items:
          client_id:
            label: Client ID
            description: The pwapp_ ID of the application an organization admin registered for this GitLab URL; empty means no ACTIVATE sign-in is configured.
            type: string
            optional: true
            tooltip: |
              Organization -> Settings -> Applications (behind the OIDC Applications preview): kind web, consent none, scopes openid profile email, redirect URI https://<subdomain>.<sessions domain>/users/auth/openid_connect/callback, post-logout redirect URI https://<subdomain>.<sessions domain>/. The redirect URI is matched exactly, so it must carry the subdomain this run pins. The provider is part of GitLab's configuration, so a later run without a client ID removes the button.
          client_secret:
            label: Client secret
            description: Required with a client ID; shown once when the secret is created, an organization admin can reveal it again on the application's page.
            type: password
            optional: true
            hidden: ${{ inputs.oidc.client_id == '' }}
            ignore: ${{ .hidden }}
          block_new_users:
            label: New users wait for approval
            description: An account created by a first ACTIVATE sign-in stays blocked until an administrator approves it under Admin -> Users; off lets every ACTIVATE user in.
            type: boolean
            default: false
            hidden: ${{ inputs.oidc.client_id == '' }}
            ignore: ${{ .hidden }}
          display_name:
            type: string
            hidden: true
            default: ACTIVATE
