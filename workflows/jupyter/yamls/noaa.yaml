# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/jupyter/app
      - name: Create Inputs
        run: |
          set -x
          # Write PW variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          service_notebook_dir="${{ inputs.service.notebook_dir }}"
          service_password="${{ inputs.service.password }}"
          service_conda_install="${{ inputs.service.conda_install }}"
          service_use_conda="${{ inputs.service.use_conda }}"
          service_parent_install_dir="${{ inputs.service.parent_install_dir }}"
          service_conda_install_dir="${{ inputs.service.conda_install_dir }}"
          service_conda_env="${{ inputs.service.conda_env }}"
          service_load_env="${{ inputs.service.load_env_tag_cloud }}"
          service_load_env="${{ inputs.service.load_env_tag_existing }}"
          service_install_instructions="${{ inputs.service.install_instructions_tag_cloud }}"
          service_install_instructions="${{ inputs.service.install_instructions_tag_existing }}"
          service_yaml="${{ inputs.service.yaml }}"
          service_install_kernels="${{ inputs.service.install_kernels }}"
          service_install_command="${{ inputs.service.install_command }}"
          pw_endpoints_args="--name ${{ inputs.service.name }}-${PW_RUN_SLUG} --slug tree"
          EOF
          # Remove empty variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh # remove var=""
          # Add export= to all lines
          sed -i 's/^/export /' inputs.sh
          # Copy conda environment YAMLs to the job directory
          cp workflows/jupyter/app/*.yaml .
      - name: Set Up Install Parent Directory
        run: |
          source inputs.sh
          set -x
          # This script prepares the target host and always runs in the controller node.
          # Large downloads can exceed the ${HOME} quota on the NOAA systems, so the
          # default install directory is a shared per-cluster software directory where
          # one staged copy serves every user. Only Alvaro.Vidal may write there: that
          # account always targets the shared directory, every other account reuses it
          # read-only when the files are already staged there and falls back to
          # ${HOME}/pw otherwise.
          if [ -n "${service_parent_install_dir}" ]; then
            echo "::notice title=Install Directory::Using Install Directory from the input form: ${service_parent_install_dir}"
          else
            if [ "existing" != "${{ inputs.resource.provider }}" ]; then
              # Cloud clusters have no shared software directory
              PROJECTS_HOME="${HOME}/pw"
            else
              case "${{ inputs.resource.ip }}" in
                hfe[0-9]*.fairmont.rdhpcs.noaa.gov) PROJECTS_HOME=/contrib/pw ;; # Hera
                mfe[0-9]*.fairmont.rdhpcs.noaa.gov) PROJECTS_HOME=/contrib/pw ;; # Mercury
                ufe[0-9]*.fairmont.rdhpcs.noaa.gov) PROJECTS_HOME=/contrib/pw ;; # Ursa
                gaea[0-9]*.ncrc.gov) PROJECTS_HOME=/usw/rdhpcs/software/pw ;; # Gaea
                an[0-9]*.princeton.rdhpcs.noaa.gov) PROJECTS_HOME="${HOME}/pw" ;; # PPAN
                # Unknown host: keep the old default of /contrib/pw when present
                *) [ -d /contrib/pw ] && PROJECTS_HOME=/contrib/pw || PROJECTS_HOME="${HOME}/pw" ;;
              esac
            fi
            if [ "$(whoami)" = "Alvaro.Vidal" ]; then
              if mkdir -p "${PROJECTS_HOME}" 2> /dev/null; then
                chmod a+rX "${PROJECTS_HOME}" 2> /dev/null || true
              else
                echo "::warning title=Install Directory::Cannot create ${PROJECTS_HOME}; falling back to ${HOME}/pw"
                PROJECTS_HOME="${HOME}/pw"
              fi
            elif ! [ -f "${PROJECTS_HOME}/${service_conda_install_dir}/etc/profile.d/conda.sh" ]; then
              # Not staged in the shared directory yet and only Alvaro.Vidal can put it there
              PROJECTS_HOME="${HOME}/pw"
            fi
            echo "::notice title=Install Directory::Using Install Directory: ${PROJECTS_HOME}"
            echo "export PROJECTS_HOME=\"${PROJECTS_HOME}\"" >> inputs.sh
            echo "export service_parent_install_dir=\"${PROJECTS_HOME}\"" >> inputs.sh
          fi
      - name: Controller Preprocessing
        run: |
          set -x
          # This script prepares the target host and always runs in the controller node
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat workflows/jupyter/app/controller.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Create Service Script
        run: |
          rm -f HOSTNAME SESSION_PORT job.ended job.started
          # This script starts the service
          cp inputs.sh start-service-${PW_JOB_ID}.sh

          # Write code common to all services
          cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

          echo "::notice::Starting service"
          EOF
          cat workflows/jupyter/app/start-template.sh >> ./start-service-${PW_JOB_ID}.sh
          echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  session_runner:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/noaa.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            account: ${{ inputs.cluster.slurm.account }}
            partition: ${{ inputs.cluster.slurm.partition }}
            qos: ${{ inputs.cluster.slurm.qos }}
            ntasks: ${{ inputs.cluster.slurm.ntasks }}
            nodes: ${{ inputs.cluster.slurm.nodes }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::Session runner failed before the endpoint came online"
          exit 1

  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        run: |
          endpoint_name="${{ inputs.service.name }}-${PW_RUN_SLUG}"
          echo "::notice::Waiting for endpoint ${endpoint_name} to come online"
          until pw endpoints list | grep -qw "${endpoint_name}"; do
            echo "$(date) Endpoint ${endpoint_name} not found yet; retrying in 10 seconds"
            sleep 10
          done
          echo "::notice::Endpoint ${endpoint_name} is online"
          touch ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          sleep 2
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Service host
        include-workspace: false
        tooltip: Resource to host the service
      cluster:
        hidden: ${{ inputs.resource.schedulerType == '' }}
        ignore: ${{ inputs.resource.schedulerType == '' }}
        type: group
        label: Compute Cluster Settings
        items:
          scheduler:
            type: boolean
            default: false
            label: Schedule Job?
            tooltip: |
              Yes → Job is submitted to the scheduler using sbatch, qsub, etc
              No  → Job is executed in the controller or login node instead
          slurm:
            type: group
            label: SLURM Directives
            hidden: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled? Yes, unless the slurm section is hidden and ignored
              account:
                label: SLURM account
                type: slurm-accounts
                resource: ${{ inputs.resource }}
                tooltip: '--account=value slurm directive'
                ignore: ${{ 'existing' != inputs.resource.provider }}
                hidden: ${{ .ignore }}
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.resource }}
                tooltip: '--partition=value SLURM directive'
              qos:
                label: Quality of Service [QoS]
                type: slurm-qos
                resource: ${{ inputs.resource }}
                tooltip: '--qos=value slurm directive'
                ignore: ${{ 'existing' != inputs.resource.provider }}
                hidden: ${{ .ignore }}
              ntasks:
                label: Number of tasks
                type: number
                default: 1
                tooltip: '--ntasks=value slurm directive'
                ignore: ${{ 'existing' != inputs.resource.provider }}
                hidden: ${{ .ignore }}
              nodes:
                label: Number of nodes
                type: number
                default: 1
                tooltip: '--nodes=value slurm directive'
                ignore: ${{ 'existing' != inputs.resource.provider }}
                hidden: true
              time:
                label: Walltime
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
              scheduler_directives:
                type: editor
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
          pbs:
            type: group
            label: PBS Directives
            hidden: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler Directives
                type: editor
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1
      service:
        type: group
        label: Jupyter Notebook Settings
        items:
          name:
            type: string
            hidden: true
            default: jupyter-host
          password:
            label: Password for notebook session
            type: password
            optional: true
            hidden: true
            ignore: true
            tooltip: Enter password or leave blank for no password
          notebook_dir:
            label: Directory to start Jupyter Notebook GUI
            type: string
            default: ${HOME}
            tooltip: This is the directory that you start with when the Jupyter graphical user interface starts. The default value here is your home directory.
          conda_install:
            label: Install Jupyter-Notebook If Not There?
            type: boolean
            default: true
            tooltip: Select Yes to install Jupyter in miniconda environment and No to load an existing python environment
          use_conda:
            label: Use Conda?
            type: boolean
            default: false
            hidden: ${{ 'existing' != inputs.resource.provider  }}
            optional: ${{ .hidden }}
            ignore: ${{ .hidden }}
            tooltip: Select Yes to install Jupyter in miniconda environment and No to load an existing python environment
          parent_install_dir:
            label: Parent Install Directory
            type: string
            optional: true
            hidden: ${{ inputs.service.conda_install == false || ('existing' == inputs.resource.provider &&  inputs.service.use_conda == false) }}
            ignore: ${{ .hidden }}
            tooltip: 'Software dependencies are installed in this directory. Default: the shared cluster software directory (/contrib/pw on Hera, Mercury, and Ursa; /usw/rdhpcs/software/pw on Gaea) when the conda installation is already staged there or your account maintains it; otherwise ${HOME}/pw. Ensure the directory has sufficient space!'
          conda_install_dir:
            label: Name of the Conda Installation Directory
            type: string
            default: .miniconda3cn
            hidden: ${{ inputs.service.conda_install == false || ('existing' == inputs.resource.provider &&  inputs.service.use_conda == false) }}
            ignore: ${{ .hidden }}
            tooltip: Ensure the directory has sufficient space for Conda and its packages.
          conda_env:
            label: Conda environment
            type: string
            default: base
            hidden: ${{ inputs.service.conda_install == false || ('existing' == inputs.resource.provider &&  inputs.service.use_conda == false) }}
            optional: ${{ .hidden }}
            ignore: ${{ .hidden }}
            tooltip: Environment to active. The base environment enables changing kernel to other environments!
          load_env_tag_cloud:
            label: Command to load Jupyter Notebook to the PATH
            type: string
            default: source ${HOME}/pw/.miniconda3cn/etc/profile.d/conda.sh; conda activate base
            hidden: ${{ inputs.service.conda_install == true || ('existing' == inputs.resource.provider &&  inputs.service.use_conda == false) }}
            optional: ${{ .hidden }}
            ignore: ${{ .hidden }}
            tooltip: Use a bash command
          load_env_tag_existing:
            label: Command to load Jupyter Notebook to the PATH
            type: string
            default: export PATH=$PATH:/home/${USER}/.local/bin; module load python
            hidden: ${{ 'existing' != inputs.resource.provider ||  inputs.service.use_conda == true }}
            optional: ${{ .hidden }}
            ignore: ${{ .hidden }}
            tooltip: Use a bash command
          install_instructions_tag_cloud:
            label: Install Instructions
            type: dropdown
            hidden: ${{ inputs.service.conda_install == false || ('existing' == inputs.resource.provider  &&  inputs.service.use_conda == false) }}
            ignore: ${{ .hidden }}
            default: notebook7.2.2-python3.12.2
            options:
              - value: latest
                label: Latest default versions of Jupyter Notebook and Python (not thoroughly tested)
              - value: notebook7.2.2-python3.12.2
                label: Jupyter Notebook 7.2.2 with Python version 3.12.2
              - value: yaml
                label: Provide custom Conda environment YAML file
          install_instructions_tag_existing:
            label: Install Instructions
            type: string
            default: install_command
            hidden: true
            ignore: ${{ inputs.service.conda_install == false || 'existing' != inputs.resource.provider ||  inputs.service.use_conda == true  }}
          yaml:
            label: Paste Conda Environment Defition YAML
            type: editor
            hidden: ${{ inputs.service.install_instructions_tag_cloud != yaml ||  inputs.service.conda_install == false  ||  ('existing' == inputs.resource.provider &&  inputs.service.use_conda == false) }}
            optional: ${{ .hidden }}
            ignore: ${{ .hidden }}
            tooltip: Copy and paste a custom Conda environment definition YAML file
          install_kernels:
            label: Select additional kernels to install
            type: multi-dropdown
            optional: true
            hidden: ${{ inputs.service.conda_install == false ||  ('existing' == inputs.resource.provider &&  inputs.service.use_conda == false)  }}
            ignore: ${{ .hidden }}
            options:
              - value: julia-kernel
                label: Julia Kernel
              - value: R-kernel
                label: R Kernel
          install_command:
            label: Command to install Jupyter
            type: string
            default: export PATH=$PATH:/home/${USER}/.local/bin; module load python; pip install --upgrade "notebook>=7" --no-warn-script-location
            hidden: ${{ inputs.service.conda_install == false || 'existing' != inputs.resource.provider  ||  inputs.service.use_conda == true  }}
            ignore: ${{ .hidden }}
