<rect x="224" y="110" width="170" height="72" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<rect x="406" y="110" width="152" height="72" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="48" y="208" width="524" height="164" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<rect x="62" y="244" width="118" height="66" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<rect x="190" y="244" width="118" height="66" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
