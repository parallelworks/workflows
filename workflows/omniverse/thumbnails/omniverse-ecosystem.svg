<rect x="48" y="384" width="524" height="60" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<rect x="48" y="456" width="524" height="74" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
