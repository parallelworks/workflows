# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
# Isaac Sim's own window (the full Omniverse Kit GUI: the stage, the viewport, the
# physics and the extensions) inside a KasmVNC browser desktop on a GPU node, from
# the same Singularity image the render variants use. Preprocessing checks the form,
# pulls the SIF once and installs app/isaac-sim-gui.sh beside it; the kasmvnc workflow,
# called as a subworkflow, starts the desktop on the login node or a SLURM/PBS node
# and runs that launcher as the desktop's startup application, so the run completes
# when the desktop answers its URL (kasmvnc-<run slug>) and Isaac Sim keeps loading in
# it for a few minutes. The desktop outlives the run until the endpoint is deleted. The
# platform's own desktop sessions cannot show the window yet (desktop-issue.txt).
# Running it accepts NVIDIA's Isaac Sim license (the container's ACCEPT_EULA):
# https://www.nvidia.com/en-us/agreements/enterprise-software/isaac-sim-additional-software-and-materials-license/
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/omniverse/app
            - workflows/omniverse/omniverse-singularity
            - tools/oras
      - name: Create Inputs
        run: |
          set -x
          # Write PW environment variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          cluster_scheduler="${{ inputs.cluster.scheduler }}"
          cluster_gpus="${{ inputs.cluster.gpus }}"
          cluster_cpus="${{ inputs.cluster.cpus }}"
          desktop_app="${{ inputs.desktop.app }}"
          software_sif_registry="${{ inputs.software.sif_registry }}"
          service_parent_install_dir="${{ inputs.software.install_dir }}"
          software_runtime="omniverse-singularity"
          software_sif="${{ inputs.software.sif }}"
          software_sif_registry="${{ inputs.software.sif_registry }}"
          EOF
          # Remove empty and undefined variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          # Add export to all lines
          sed -i 's/^/export /' inputs.sh
      - name: Controller Preprocessing
        run: |
          set -x
          # This script checks the form's values and pulls the SIF; it always runs in the controller node
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat workflows/omniverse/omniverse-singularity/controller.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Scheduler Directives
        run: |
          source inputs.sh
          bash workflows/omniverse/app/scheduler-directives.sh

  desktop:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Desktop with Isaac Sim
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/kasmvnc/yamls/general.yaml
          resource: ${{ inputs.resource }}
          cluster:
            scheduler: ${{ inputs.cluster.scheduler }}
            slurm:
              is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
              partition: ${{ inputs.cluster.slurm.partition }}
              time: ${{ inputs.cluster.slurm.time }}
              scheduler_directives: |
                ${{ needs.preprocessing.outputs.SLURM_CPU_DIRECTIVE }}
                ${{ needs.preprocessing.outputs.SLURM_GPU_DIRECTIVE }}
                ${{ inputs.cluster.slurm.scheduler_directives }}
            pbs:
              is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
              scheduler_directives: |
                ${{ needs.preprocessing.outputs.PBS_RESOURCE_DIRECTIVE }}
                ${{ inputs.cluster.pbs.scheduler_directives }}
          desktop:
            kasmvnc_os: rocky9
            startup_command: bash ${{ inputs.software.install_dir }}/omniverse/isaac-sim-gui.sh ${{ inputs.desktop.app }}

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: GPU host
        include-workspace: false
        tooltip: The desktop and Isaac Sim run on its login node, or on a compute node when submitted to the scheduler
      cluster:
        hidden: ${{ inputs.resource.schedulerType == '' }}
        ignore: ${{ inputs.resource.schedulerType == '' }}
        type: group
        label: Compute cluster settings
        items:
          scheduler:
            type: boolean
            default: false
            label: Submit to the scheduler
            description: Otherwise the job runs on the login node.
          cpus:
            type: number
            label: Cores per job
            description: Requested ahead of the directives below; a job gets one core by default, and Kit stalls on one.
            default: 8
            min: 1
            max: 256
            step: 1
            hidden: ${{ inputs.resource.schedulerType == '' || inputs.cluster.scheduler == false }}
            ignore: ${{ .hidden }}
            tooltip: |
              Requested as --cpus-per-task=N (PBS: -l select=1:ncpus=N) ahead of the directives
              below, which can override it.
          gpus:
            type: number
            label: GPUs per job
            description: Requested ahead of the directives below; 0 requests none, which is right for cloud clusters.
            default: 0
            min: 0
            max: 8
            step: 1
            hidden: ${{ inputs.resource.schedulerType == '' || inputs.cluster.scheduler == false }}
            ignore: ${{ .hidden }}
            tooltip: |
              Requested as --gres=gpu:N (PBS: -l select=1:ngpus=N) ahead of the directives
              below, which can override it. The cloud clusters define no GRES (every node of
              a GPU partition has its GPU), so 0 requests none; an on-premises cluster that
              schedules GPUs as GRES takes 1.
          slurm:
            type: group
            label: SLURM directives
            hidden: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                description: Pick a partition with GPU nodes.
                optional: true
                resource: ${{ inputs.resource }}
              time:
                label: Walltime
                description: HH:MM:SS, or D-HH:MM:SS for runs over a day; the desktop ends with the job.
                type: string
                default: '04:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
              scheduler_directives:
                type: editor
                label: Scheduler directives
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
          pbs:
            type: group
            label: PBS directives
            hidden: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler directives
                type: editor
                optional: true
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l walltime=04:00:00
                  #PBS -l select=1:ncpus=8:ngpus=1
      desktop:
        type: group
        label: Desktop
        items:
          app:
            type: dropdown
            label: Application
            description: Started in the desktop a few seconds after it opens; Isaac Sim takes about three minutes to show its window.
            default: physx
            options:
              - value: physx
                label: Isaac Sim (PhysX)
              - value: newton
                label: Isaac Sim with Newton physics
            tooltip: The full Isaac Sim application from the SIF (isaac-sim.sh or isaac-sim.newton.sh), its window on the desktop's X server; an xterm on the node is there too.
      software:
        type: group
        label: Software
        collapsed: true
        items:
          sif:
            type: string
            label: Singularity image file
            description: Empty pulls ghcr.io/parallelworks/isaac-sim:6.2.0.1 into the install directory once.
            optional: true
            tooltip: A SIF built with build-container.sh from the workflow's isaac-sim.def, on a filesystem the desktop's node sees.
          sif_registry:
            type: string
            hidden: true
            default: ghcr.io/parallelworks/isaac-sim:6.2.0.1
            label: The prebuilt SIF's ORAS reference; its tag names the file in the install directory
          install_dir:
            type: string
            label: Install directory
            default: ${HOME}/pw/software
            tooltip: Isaac Sim's home (its shader caches and logs) goes under <install directory>/omniverse/cache once, so later starts on the node are faster; the Singularity image goes under <install directory>/omniverse/containers.
