# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
# Isaac Sim's own window (the full Omniverse Kit GUI: the stage, the viewport, the
# physics and the extensions) in a platform desktop session on the GPU host's login
# node, from the same Singularity image the render workflow uses. The steps check the
# form, pull the SIF once, install app/isaac-sim-gui.sh beside it with an Isaac Sim entry
# in the desktops' Applications menu, start the desktop session omniverse-<run slug>
# with pw sessions create, and start Isaac Sim on its display (app/desktop-session.sh).
# The run completes when Kit reports its window ready. The session outlives the run
# until it is stopped, and Isaac Sim ends with it.
# Running it accepts NVIDIA's Isaac Sim license (the container's ACCEPT_EULA):
# https://www.nvidia.com/en-us/agreements/enterprise-software/isaac-sim-additional-software-and-materials-license/
permissions:
  - '*'

jobs:
  desktop:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: omniverse-usd-export
          sparse_checkout:
            - workflows/omniverse/app
            - workflows/omniverse/omniverse-singularity
            - tools/oras
      - name: Create Inputs
        run: |
          set -x
          # Write PW environment variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          desktop_app="${{ inputs.desktop.app }}"
          desktop_stage="${{ inputs.desktop.stage }}"
          software_sif_registry="${{ inputs.software.sif_registry }}"
          service_parent_install_dir="${{ inputs.software.install_dir }}"
          software_runtime="omniverse-singularity"
          software_sif="${{ inputs.software.sif }}"
          resource_name="${{ inputs.resource.name }}"
          resource_namespace="${{ inputs.resource.namespace }}"
          EOF
          echo "session_name=omniverse-${PW_RUN_SLUG}" >> inputs.sh
          # Remove empty and undefined variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          sed -i '/="undefined"/d' inputs.sh
          # The session's cluster as pw sessions create takes it
          if grep -q '^resource_namespace=' inputs.sh; then
            echo 'session_resource="pw://${resource_namespace}/${resource_name}"' >> inputs.sh
          else
            echo 'session_resource="${resource_name}"' >> inputs.sh
          fi
          # Add export to all lines
          sed -i 's/^/export /' inputs.sh
      - name: Controller Preprocessing
        run: |
          set -x
          # This script checks the form's values and pulls the SIF; it always runs in the controller node
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat workflows/omniverse/omniverse-singularity/controller.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Desktop session with Isaac Sim
        run: |
          source inputs.sh
          bash workflows/omniverse/app/desktop-session.sh
        cleanup: |
          # A run that failed or was canceled before Isaac Sim was ready leaves no session
          if [ -f isaac-sim.ready ]; then
            exit 0
          fi
          export PATH=$HOME/pw:$PATH
          pw sessions stop "omniverse-${PW_RUN_SLUG}" > /dev/null 2>&1 || true

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: GPU host
        include-workspace: false
        tooltip: The desktop session and Isaac Sim run on its login node, which needs an NVIDIA GPU and singularity or apptainer
      desktop:
        type: group
        label: Desktop
        items:
          app:
            type: dropdown
            label: Application
            description: Started in the desktop session once it is up; the run completes when its window is ready, under a minute once the node's shader caches exist.
            default: physx
            options:
              - value: physx
                label: Isaac Sim (PhysX)
              - value: newton
                label: Isaac Sim with Newton physics
            tooltip: The full Isaac Sim application from the SIF (isaac-sim.sh or isaac-sim.newton.sh), its window on the session's X server. The Applications menu of later desktop sessions gets an Isaac Sim entry too.
          stage:
            type: string
            label: Stage to follow
            optional: true
            description: A USD file, or a directory holding study.usda, opened once it exists and reloaded whenever it changes; empty opens an empty stage. The path cannot contain spaces.
            tooltip: |
              Give the usd-export workflow's stage directory (default ${HOME}/pw/omniverse/stages/study) to watch
              designs arrive while an export runs. Select /World and pick the field (velocity, pressure,
              turbulence) under Variants in the Property panel. Opening another stage from the File menu
              stops the following.
      software:
        type: group
        label: Software
        collapsed: true
        items:
          sif:
            type: string
            label: Singularity image file
            description: Empty pulls ghcr.io/parallelworks/isaac-sim:6.2.0.1 into the install directory once.
            optional: true
            tooltip: A SIF built with build-container.sh from the workflow's isaac-sim.def, readable on the GPU host.
          sif_registry:
            type: string
            hidden: true
            default: ghcr.io/parallelworks/isaac-sim:6.2.0.1
            label: The prebuilt SIF's ORAS reference; its tag names the file in the install directory
          install_dir:
            type: string
            label: Install directory
            default: ${HOME}/pw/software
            tooltip: Isaac Sim's home (its shader caches and logs) goes under <install directory>/omniverse/cache once, so later starts on the node are faster; the Singularity image goes under <install directory>/omniverse/containers.
