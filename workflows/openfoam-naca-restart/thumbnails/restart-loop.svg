<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a9850"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="860" height="400" rx="10" fill="#fcfcfb" stroke="#d8d5cf"/>

  <!-- the retried step -->
  <rect x="20" y="20" width="820" height="170" rx="8" fill="#ffffff" stroke="#898781" stroke-dasharray="6 4"/>
  <text x="32" y="40" font-size="13" font-weight="bold" fill="#0b0b0b">general.yaml: the Solve step, retried while it exits non-zero (max-retries = max_restarts, timeout = attempt_timeout)</text>

  <!-- attempt.yaml -->
  <rect x="32" y="56" width="250" height="120" rx="6" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="42" y="76" font-size="13" font-weight="bold" fill="#0b0b0b">attempt.yaml: one attempt</text>
  <text x="42" y="94" font-size="11" fill="#2a78d6">uses openfoam-naca/yamls/general.yaml</text>
  <text x="42" y="108" font-size="11" fill="#52514e">on the shared case directory,</text>
  <text x="42" y="122" font-size="11" fill="#52514e">resume: true (ignore-errors)</text>
  <text x="42" y="144" font-size="11" fill="#52514e">then reads the case's state:</text>
  <text x="42" y="158" font-size="11" fill="#1a9850">over → exit 0</text>
  <text x="150" y="158" font-size="11" fill="#c0392b">interrupted → exit 1</text>

  <!-- openfoam-naca -->
  <rect x="312" y="56" width="516" height="120" rx="6" fill="#ffffff" stroke="#898781"/>
  <text x="322" y="76" font-size="13" font-weight="bold" fill="#0b0b0b">openfoam-naca, whole: preprocessing → script_submitter → results</text>
  <text x="322" y="94" font-size="11" fill="#52514e">preprocessing reruns every attempt (checkout, environment, params.in, case.sh)</text>
  <text x="322" y="112" font-size="11" fill="#52514e">case.sh forwards the walltime SIGTERM to simulator.sh, which (restart.sh):</text>
  <text x="334" y="128" font-size="11" fill="#52514e">skips blockMesh, decomposePar, potentialFoam once done · discards an incomplete checkpoint</text>
  <text x="334" y="142" font-size="11" fill="#52514e">restarts simpleFoam from latestTime · writes the fields every checkpoint_every iterations</text>
  <text x="334" y="156" font-size="11" fill="#52514e">records the attempt in attempts.log · tells a signal from a solver that failed on its own</text>
  <text x="322" y="172" font-size="11" fill="#52514e">results fails without results.out: expected while the case is interrupted</text>

  <line x1="282" y1="100" x2="312" y2="100" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#aB)"/>

  <!-- the interruptions -->
  <rect x="20" y="210" width="250" height="78" rx="6" fill="#fdf0ee" stroke="#c0392b"/>
  <text x="30" y="230" font-size="13" font-weight="bold" fill="#0b0b0b">what interrupts an attempt</text>
  <text x="30" y="248" font-size="11" fill="#52514e">the scheduler's walltime (cluster.slurm.time)</text>
  <text x="30" y="262" font-size="11" fill="#52514e">the attempt budget (restart.attempt_timeout)</text>
  <text x="30" y="276" font-size="11" fill="#52514e">a preempted or lost node (no record left)</text>
  <line x1="145" y1="210" x2="145" y2="190" stroke="#c0392b" stroke-width="1.5" marker-end="url(#aR)"/>

  <!-- the case directory -->
  <rect x="300" y="210" width="270" height="170" rx="6" fill="#ffffff" stroke="#898781"/>
  <text x="310" y="230" font-size="13" font-weight="bold" fill="#0b0b0b">the case directory, shared by every attempt</text>
  <text x="310" y="248" font-size="11" fill="#52514e">attempts.log      one start and one end line per attempt</text>
  <text x="310" y="262" font-size="11" fill="#52514e">case/restart/inputs      the design and settings</text>
  <text x="310" y="276" font-size="11" fill="#52514e">case/restart/&lt;stage&gt;.done      what is finished</text>
  <text x="310" y="290" font-size="11" fill="#52514e">case/restart/failed      a solver that failed on its own</text>
  <text x="310" y="304" font-size="11" fill="#52514e">case/&lt;iteration&gt;/      the last keep_checkpoints checkpoints</text>
  <text x="310" y="318" font-size="11" fill="#52514e">case/log.simpleFoam.&lt;attempt&gt;      every attempt's solver log</text>
  <text x="310" y="332" font-size="11" fill="#52514e">results.out, exit_code      openfoam-naca's own outcome files</text>
  <text x="310" y="356" font-size="11" fill="#52514e">a later run given this directory continues the case</text>
  <line x1="435" y1="190" x2="435" y2="210" stroke="#52514e" stroke-width="1.5" marker-start="url(#aK)" marker-end="url(#aK)"/>

  <!-- the report -->
  <rect x="600" y="210" width="240" height="170" rx="6" fill="#eefaf1" stroke="#1a9850"/>
  <text x="610" y="230" font-size="13" font-weight="bold" fill="#0b0b0b">Report (if: always)</text>
  <text x="610" y="248" font-size="11" fill="#52514e">reads attempts.log and the state files:</text>
  <text x="610" y="270" font-size="11" fill="#1a9850">solved in N attempts, K interrupted</text>
  <text x="610" y="284" font-size="11" fill="#1a9850">→ Cd, Cl, the run completes</text>
  <text x="610" y="306" font-size="11" fill="#c0392b">failed on its own (diverged) → error,</text>
  <text x="610" y="320" font-size="11" fill="#c0392b">never retried</text>
  <text x="610" y="342" font-size="11" fill="#c0392b">attempts ran out, still interrupted</text>
  <text x="610" y="356" font-size="11" fill="#c0392b">→ error, the case stays resumable</text>
  <line x1="570" y1="290" x2="600" y2="290" stroke="#1a9850" stroke-width="1.5" marker-end="url(#aG)"/>
</svg>
