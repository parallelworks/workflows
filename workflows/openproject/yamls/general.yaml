# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: openproject
          sparse_checkout:
            - workflows/openproject/app
      - name: Create Inputs
        run: |
          set -x
          # Write PW environment variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # An Enterprise token spans several lines, so it goes into its own file
          cat <<'EOF' > enterprise-token.txt
          ${{ inputs.service.enterprise_token }}
          EOF
          tr -d '\r' < enterprise-token.txt | sed '/^[[:space:]]*$/d; /^undefined$/d' > enterprise-token.tmp
          mv enterprise-token.tmp enterprise-token.txt
          chmod 600 enterprise-token.txt
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          service_rundir="${{ inputs.service.rundir }}"
          service_subdomain="${{ inputs.service.subdomain }}"
          service_admin_password="${{ inputs.service.admin_password }}"
          service_image="${{ inputs.service.image }}"
          service_enterprise_token_file="${PW_PARENT_JOB_DIR}/enterprise-token.txt"
          oidc_client_id="${{ inputs.oidc.client_id }}"
          oidc_client_secret="${{ inputs.oidc.client_secret }}"
          oidc_display_name="${{ inputs.oidc.display_name }}"
          pw_endpoints_args="--name ${{ inputs.service.name }}-${PW_RUN_SLUG}"
          EOF
          # Remove empty and undefined variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          # Add export to all lines
          sed -i 's/^/export /' inputs.sh
      - name: Controller Preprocessing
        run: |
          set -x
          # This script prepares the target host and always runs in the controller node
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat workflows/openproject/app/controller.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Create Service Script
        run: |
          rm -f HOSTNAME SESSION_PORT job.ended job.started
          # This script starts the service
          cp inputs.sh start-service-${PW_JOB_ID}.sh

          # Write code common to all services
          cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

          echo "::notice::Starting service"
          EOF
          cat workflows/openproject/app/start-template.sh >> ./start-service-${PW_JOB_ID}.sh
          echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  session_runner:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
            gpus: ${{ inputs.cluster.slurm.gpus }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::Session runner failed before the endpoint came online"
          exit 1

  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: ${{ inputs.service.name }}-${PW_RUN_SLUG}
          host: ${{ inputs.resource.ip }}
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          path: /login
          healthy: '2*'
          budget: 1800
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Service host
        include-workspace: false
      cluster:
        hidden: ${{ inputs.resource.schedulerType == '' }}
        ignore: ${{ inputs.resource.schedulerType == '' }}
        type: group
        label: Compute cluster settings
        items:
          scheduler:
            type: boolean
            default: false
            label: Submit to the scheduler
            description: Otherwise the job runs on the login node.
          slurm:
            type: group
            label: SLURM directives
            hidden: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.resource }}
              time:
                label: Walltime
                description: HH:MM:SS, or D-HH:MM:SS for runs over a day.
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
              gpus:
                label: Number of GPUs
                type: number
                optional: true
                min: 0
                step: 1
                default: 0
                hidden: ${{ inputs.resource.ip != 'dn-slurm-1.parallel.works' }}
                ignore: ${{ .hidden }}
                tooltip: '--gpus= SLURM directive to set the number of GPUs allocated for the job'
              scheduler_directives:
                type: editor
                label: Scheduler directives
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
          pbs:
            type: group
            label: PBS directives
            hidden: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler directives
                type: editor
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1
      service:
        type: group
        label: OpenProject settings
        collapsed: true
        items:
          name:
            type: string
            hidden: true
            default: openproject
          subdomain:
            label: Subdomain
            description: Label of the URL, https://<label>.<sessions domain>, the same on every run; empty uses openproject-<your username>.
            type: string
            optional: true
            tooltip: |
              The endpoint is served at https://<label>.<sessions domain>/ on every run, so bookmarks, browser state and the redirect URI registered for Sign in with ACTIVATE keep working. Lowercase letters, digits and dashes; reserve it with 'pw subdomains reserve <label>' so nobody else takes it. Two OpenProjects of yours (two clusters) need two labels.
          rundir:
            label: Run directory
            description: Keeps the database and attachments; reuse it to keep projects and users, delete it (with sudo) to start over.
            type: string
            default: ${HOME}/openproject
            tooltip: |
              Holds pgdata/ (PostgreSQL, written as the container's postgres user), assets/ (attachments) and the generated secret key. One OpenProject per run directory at a time.
          admin_password:
            label: Admin password
            description: Applied when the run directory is first initialized; empty keeps OpenProject's default admin / admin with a forced change at first login.
            type: password
            optional: true
            tooltip: |
              At least 10 characters. Later sessions keep the current password; change it in OpenProject.
          image:
            label: OpenProject image
            description: Keep the major version of an existing run directory.
            type: string
            default: openproject/openproject:17
            tooltip: |
              The all-in-one image (web, worker, PostgreSQL, memcached). A new major version may need the PostgreSQL data upgraded first; see the OpenProject upgrade guide.
          enterprise_token:
            label: Enterprise token
            description: OpenProject shows Sign in with ACTIVATE (like every SSO provider) only with an active Enterprise edition token; a trial requested inside OpenProject is kept in the run directory instead.
            type: editor
            optional: true
            tooltip: |
              Paste the token block (-----BEGIN OPENPROJECT-ENTERPRISE-TOKEN----- ... -----END ...). It is imported once into the database of the run directory. Without a token OpenProject still runs with its own user accounts.
      oidc:
        type: group
        label: Sign in with ACTIVATE
        collapsed: true
        items:
          client_id:
            label: Client ID
            description: Of the application an organization admin registered for this OpenProject URL; empty disables Sign in with ACTIVATE.
            type: string
            optional: true
            tooltip: |
              Organization -> Settings -> Applications: kind web, redirect URI https://<subdomain>.<sessions domain>/auth/activate/callback, post-logout redirect URI https://<subdomain>.<sessions domain>/, scopes openid profile email, consent none. The client ID starts with pwapp_.
          client_secret:
            label: Client secret
            description: Required with a client ID; shown once when the secret is created, an organization admin can reveal it again on the application's page.
            type: password
            optional: true
          display_name:
            type: string
            hidden: true
            default: ACTIVATE
