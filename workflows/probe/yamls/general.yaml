# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
# PROBE dashboards. Like the other endpoint workflows here: a start script per
# dashboard is submitted through script_submitter, wait_for_endpoint waits until
# the endpoint answers and touches the skip-cleanups file, the submitter job is
# cancelled and the run completes while the dashboards keep serving. Take them
# down with pw endpoints delete probe-<run slug> and probe-admin-<run slug>.
# Tests are run from the admin dashboard or from yamls/general_run_tests.yaml;
# the results store, a bucket or a directory on the host, is the ground truth.
#
# The run's own PW_API_KEY stops working when the run completes and cannot be
# overridden, so the dashboards run on a credential that outlives it: on a
# cloud cluster the API key given as input (the env block carries it into
# every step, including the script the submitter launches, and the start
# script exports it as PW_API_KEY); on the user workspace and the clusters the
# agent connects, which are signed in as the user, the host's own pw sign-in
# (the input is hidden there and the start script unsets the run's key).
# Setup checks the credential before anything is submitted.
permissions:
  - '*'
env:
  PROBE_API_KEY: ${{ inputs.api_key }}
jobs:
  setup:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/probe/app
      - name: Fetch test definitions
        run: |
          set -eo pipefail
          cd ${PW_PARENT_JOB_DIR}
          export PYTHONPATH=${PW_PARENT_JOB_DIR}/workflows/probe/app
          # A CLI run leaves an omitted input empty or undefined, so the form's
          # defaults are applied here as well
          TESTS_REPO="${{ inputs.tests.repo }}"
          case "${TESTS_REPO}" in ''|undefined) TESTS_REPO=https://github.com/parallelworks/probe-tests-activate-parallel-works.git ;; esac
          TESTS_BRANCH="${{ inputs.tests.branch }}"
          case "${TESTS_BRANCH}" in ''|undefined) TESTS_BRANCH=main ;; esac
          TESTS_DIR="${{ inputs.tests.directory }}"
          case "${TESTS_DIR}" in ''|undefined) TESTS_DIR=tests ;; esac
          python3 -m probe fetch-tests --repo "${TESTS_REPO}" --branch "${TESTS_BRANCH}" \
            --directory "${TESTS_DIR}" --out tests
          python3 -m probe list --tests tests --platform "${PW_PLATFORM_HOST}" --user "${PW_USER}" \
            || echo "::warning::Some test definitions are invalid; see above"
      - name: Locate the results
        run: |
          cd ${PW_PARENT_JOB_DIR}
          export PATH=$HOME/pw:$PATH
          # A run launched without a location (the CLI, a definition from before
          # the input existed) keeps the bucket
          LOCATION="${{ inputs.results.location }}"
          case "${LOCATION}" in ''|undefined) LOCATION=bucket ;; esac
          case "${LOCATION}" in
            bucket)
              BUCKET="${{ inputs.results.bucket.uri }}"
              case "${BUCKET}" in
                ''|undefined|pw://) echo "::error::A results bucket is required"; exit 1 ;;
              esac
              RESULTS_PATH="${{ inputs.results.path }}"
              case "${RESULTS_PATH}" in ''|undefined) RESULTS_PATH=probe/results ;; esac
              RESULTS_BUCKET="${BUCKET%/}/${RESULTS_PATH}"
              RESULTS_BUCKET="${RESULTS_BUCKET%/}"
              RESULTS_DIR=${PW_PARENT_JOB_DIR%/}/results
              mkdir -p "${RESULTS_DIR}"
              if out=$(pw buckets cp -r "${RESULTS_BUCKET}/" "${RESULTS_DIR}/" 2>&1); then
                echo "::notice::Results restored from ${RESULTS_BUCKET}"
              elif echo "${out}" | grep -q "no objects found"; then
                echo "::notice::No results yet at ${RESULTS_BUCKET}"
              else
                echo "${out}"
                echo "::error::Could not restore results from ${RESULTS_BUCKET}"
                exit 1
              fi
              ;;
            local)
              RESULTS_BUCKET=""
              RESULTS_DIR="${{ inputs.results.directory }}"
              case "${RESULTS_DIR}" in ''|undefined) RESULTS_DIR=${HOME}/pw/probe/results ;; esac
              case "${RESULTS_DIR}" in
                /*) ;;
                *) echo "::error::The results directory must be an absolute path: ${RESULTS_DIR}"; exit 1 ;;
              esac
              mkdir -p "${RESULTS_DIR}" || { echo "::error::Cannot create the results directory ${RESULTS_DIR}"; exit 1; }
              echo "::notice::Results read and written in ${RESULTS_DIR} on $(hostname)"
              ;;
            *) echo "::error::Unknown results location: ${LOCATION}"; exit 1 ;;
          esac
          printf 'RESULTS_DIR=%q\nRESULTS_BUCKET=%q\n' "${RESULTS_DIR}" "${RESULTS_BUCKET}" > results.env
      - name: Create the dashboard start scripts
        run: |
          set -e
          cd ${PW_PARENT_JOB_DIR}
          source results.env
          TESTS_REPO="${{ inputs.tests.repo }}"
          case "${TESTS_REPO}" in ''|undefined) TESTS_REPO=https://github.com/parallelworks/probe-tests-activate-parallel-works.git ;; esac
          TESTS_BRANCH="${{ inputs.tests.branch }}"
          case "${TESTS_BRANCH}" in ''|undefined) TESTS_BRANCH=main ;; esac
          TESTS_DIR="${{ inputs.tests.directory }}"
          case "${TESTS_DIR}" in ''|undefined) TESTS_DIR=tests ;; esac
          export PATH=$HOME/pw:$PATH
          case "${PROBE_API_KEY}" in ''|undefined) PROBE_API_KEY="" ;; esac
          if [ -n "${PROBE_API_KEY}" ]; then
            if ! PW_API_KEY="${PROBE_API_KEY}" pw auth whoami >/dev/null 2>&1; then
              echo "::error::The API key given does not authenticate on $(hostname)"; exit 1
            fi
            AUTH_LINE='export PW_API_KEY="${PROBE_API_KEY}"'
            echo "::notice::The dashboards authenticate with the API key given, which outlives this run"
          elif env -u PW_API_KEY pw auth whoami >/dev/null 2>&1; then
            AUTH_LINE='unset PW_API_KEY'
            echo "::notice::The dashboards authenticate with the pw sign-in of $(hostname), which outlives this run"
          else
            echo "::error::No credential outlives this run on $(hostname): give an API key, or run pw auth there"; exit 1
          fi
          for kind in dashboard admin; do
            mkdir -p ${kind}
            if [ "${kind}" = admin ]; then
              name="probe-admin-${PW_RUN_SLUG}"; flag="--admin"
            else
              name="probe-${PW_RUN_SLUG}"; flag=""
            fi
            # Unquoted heredoc: names, paths and the results location are filled in
            # now; the escaped variables are evaluated when the script runs.
            cat > ${kind}/start.sh <<EOF
          #!/bin/bash
          # Serves the PROBE ${kind} dashboard as endpoint ${name} until the endpoint is deleted.
          export PATH=\$HOME/pw:\$PATH
          export PYTHONPATH=${PW_PARENT_JOB_DIR}/workflows/probe/app
          export PW_PLATFORM_HOST="${PW_PLATFORM_HOST}" PW_USER="${PW_USER}"
          # The run's own PW_API_KEY stops working when the run completes: the key from
          # the workflow input, carried here by the workflow's env block, or the host's
          # own pw sign-in serves the dashboard, as decided at setup.
          ${AUTH_LINE}
          echo "pw endpoints delete ${name} || true" > cancel.sh
          chmod +x cancel.sh
          cd ${PW_PARENT_JOB_DIR}
          echo "::notice::Starting endpoint ${name}"
          pw endpoints run --name ${name} -o text -- \\
            python3 -u -m probe serve ${flag} --port {port} --prefix {path} --results "${RESULTS_DIR}" --tests tests ${RESULTS_BUCKET:+--bucket ${RESULTS_BUCKET}} \\
              --tests-repo "${TESTS_REPO}" --tests-branch "${TESTS_BRANCH}" --tests-directory "${TESTS_DIR}"
          if [ \$? -ne 0 ]; then
            # pw endpoints run blocks for the life of the endpoint, so it also exits
            # non-zero when this job is cancelled after a successful start. Only a
            # start that never registered its endpoint is a failure.
            if pw endpoints list 2>/dev/null | awk -F'\\t' '{print \$1}' | grep -qxF "${name}"; then
              echo "::notice::Endpoint ${name} served until this job was cancelled"
              exit 0
            fi
            echo "::error title=Error::pw endpoints run failed for ${name}"
            exit 1
          fi
          EOF
            chmod +x ${kind}/start.sh
            echo "--- ${kind}/start.sh"; cat ${kind}/start.sh
          done
          echo "DASHBOARD_SCRIPT=${PW_PARENT_JOB_DIR}/dashboard/start.sh" | tee -a $OUTPUTS
          echo "DASHBOARD_SKIP=${PW_PARENT_JOB_DIR}/dashboard/SKIP_CLEANUP" | tee -a $OUTPUTS
          echo "ADMIN_SCRIPT=${PW_PARENT_JOB_DIR}/admin/start.sh" | tee -a $OUTPUTS
          echo "ADMIN_SKIP=${PW_PARENT_JOB_DIR}/admin/SKIP_CLEANUP" | tee -a $OUTPUTS

  dashboard_runner:
    needs:
      - setup
    working-directory: ${{ env.PW_PARENT_JOB_DIR }}/dashboard
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Serve the dashboard
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.setup.outputs.DASHBOARD_SCRIPT }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          rundir: ${{ env.PW_PARENT_JOB_DIR }}/dashboard
          scheduler: false
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.setup.outputs.DASHBOARD_SKIP }}
          slurm:
            is_enabled: false
          pbs:
            is_enabled: false
      - name: Cancel the dashboard wait
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - dashboard_wait
      - name: Exit with error
        run: |
          echo "::error title=Error::The dashboard stopped before its endpoint came online"
          exit 1

  dashboard_wait:
    needs:
      - setup
    working-directory: ${{ env.PW_PARENT_JOB_DIR }}/dashboard
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for the dashboard endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: probe-${PW_RUN_SLUG}
          host: ${{ inputs.resource.ip }}
          skip_cleanups_file: ${{ needs.setup.outputs.DASHBOARD_SKIP }}
      - name: Release the dashboard runner
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - dashboard_runner

  admin_runner:
    needs:
      - setup
    working-directory: ${{ env.PW_PARENT_JOB_DIR }}/admin
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Serve the admin dashboard
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.setup.outputs.ADMIN_SCRIPT }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          rundir: ${{ env.PW_PARENT_JOB_DIR }}/admin
          scheduler: false
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.setup.outputs.ADMIN_SKIP }}
          slurm:
            is_enabled: false
          pbs:
            is_enabled: false
      - name: Cancel the admin wait
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - admin_wait
      - name: Exit with error
        run: |
          echo "::error title=Error::The admin dashboard stopped before its endpoint came online"
          exit 1

  admin_wait:
    needs:
      - setup
    working-directory: ${{ env.PW_PARENT_JOB_DIR }}/admin
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for the admin endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: probe-admin-${PW_RUN_SLUG}
          host: ${{ inputs.resource.ip }}
          skip_cleanups_file: ${{ needs.setup.outputs.ADMIN_SKIP }}
      - name: Release the admin runner
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - admin_runner

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Host
        description: The user workspace, or a cluster login node with the pw CLI, python3 and git.
        include-workspace: true
        tooltip: |
          Where the dashboards run: the user workspace or the login node of a
          connected cluster with the pw CLI, python3 and git. Tests started from
          the admin dashboard are launched from here with the pw CLI.
      api_key:
        type: password
        label: API key
        description: Required on a cloud cluster; the dashboards use it after this run completes.
        tooltip: A platform API key of yours (account settings, API keys).
        hidden: ${{ inputs.resource.provider == 'existing' || inputs.resource.provider == 'managed-cluster' || inputs.resource.name == 'user-workspace' }}
        ignore: ${{ .hidden }}
      tests:
        type: group
        label: Test definitions
        tooltip: Git repository, branch and directory of the test definition files.
        items:
          repo:
            type: string
            label: Repository
            default: https://github.com/parallelworks/probe-tests-activate-parallel-works.git
          branch:
            type: string
            label: Branch
            default: main
          directory:
            type: string
            label: Directory
            default: tests
            tooltip: |
              Every *.json file below this directory is a test definition. Only the
              ones whose platform and user match this run can be executed.
      results:
        type: group
        label: Results
        tooltip: |
          Where the results live. A bucket is restored into the run when it
          starts and pulled again by Refresh on the dashboard; a directory on
          the host is read and written in place and kept between runs.
        items:
          location:
            type: dropdown
            label: Location
            default: bucket
            description: A bucket is restored when the run starts; a directory on the host is read in place.
            options:
              - label: Bucket
                value: bucket
              - label: Local filesystem
                value: local
          bucket:
            type: bucket
            label: Bucket
            hidden: ${{ inputs.results.location != 'bucket' }}
            ignore: ${{ .hidden }}
          path:
            type: string
            label: Path in bucket
            default: probe/results
            hidden: ${{ inputs.results.location != 'bucket' }}
            ignore: ${{ .hidden }}
          directory:
            type: string
            label: Directory
            default: ${HOME}/pw/probe/results
            description: Absolute path on the host, created when missing; ${HOME} is the home directory there.
            hidden: ${{ inputs.results.location != 'local' }}
            ignore: ${{ .hidden }}
