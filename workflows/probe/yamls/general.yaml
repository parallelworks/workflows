# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
# PROBE dashboards. Like the other endpoint workflows here: the start script
# (app/start-dashboard.sh, run from dashboard/ and from admin/, which tells it
# which dashboard it serves) is submitted through script_submitter once per
# dashboard, wait_for_endpoint waits until the endpoint answers and touches the
# skip-cleanups file, the submitter job is cancelled and the run completes while
# the dashboards keep serving. Take them down with pw endpoints delete
# probe-<run slug> and probe-admin-<run slug>. Tests are run from the admin
# dashboard or from yamls/general_run_tests.yaml; the results store, a bucket
# or a directory on the host, is the ground truth. Setup is app/setup.sh,
# shared with general_run_tests.yaml.
#
# The run's own PW_API_KEY stops working when the run completes and cannot be
# overridden, so the dashboards run on a credential that outlives it: on a
# cloud cluster the API key given as input (the env block carries it into
# every step, including the script the submitter launches, which exports it as
# PW_API_KEY); on the user workspace and the clusters the agent connects, which
# are signed in as the user, the host's own pw sign-in (the input is hidden
# there and the start script unsets the run's key). app/credential.sh checks
# the credential before anything is submitted.
permissions:
  - '*'
env:
  PROBE_API_KEY: ${{ inputs.api_key }}
jobs:
  setup:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: probe
          sparse_checkout:
            - workflows/probe/app
      - name: Set up
        run: |
          cd ${PW_PARENT_JOB_DIR}
          mkdir -p dashboard admin
          TESTS_REPO="${{ inputs.tests.repo }}" TESTS_BRANCH="${{ inputs.tests.branch }}" TESTS_DIR="${{ inputs.tests.directory }}" \
          RESULTS_LOCATION="${{ inputs.results.location }}" RESULTS_BUCKET_URI="${{ inputs.results.bucket.uri }}" \
          RESULTS_PATH="${{ inputs.results.path }}" RESULTS_DIRECTORY="${{ inputs.results.directory }}" RESTORE_RESULTS=true \
            bash workflows/probe/app/setup.sh
      - name: Check the credential
        run: |
          cd ${PW_PARENT_JOB_DIR}
          bash workflows/probe/app/credential.sh

  dashboard_runner:
    needs:
      - setup
    working-directory: ${{ env.PW_PARENT_JOB_DIR }}/dashboard
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Serve the dashboard
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ env.PW_PARENT_JOB_DIR }}/workflows/probe/app/start-dashboard.sh
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          rundir: ${{ env.PW_PARENT_JOB_DIR }}/dashboard
          scheduler: false
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ env.PW_PARENT_JOB_DIR }}/dashboard/SKIP_CLEANUP
          slurm:
            is_enabled: false
          pbs:
            is_enabled: false
      - name: Cancel the dashboard wait
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - dashboard_wait
      - name: Exit with error
        run: |
          echo "::error title=Error::The dashboard stopped before its endpoint came online"
          exit 1

  dashboard_wait:
    needs:
      - setup
    working-directory: ${{ env.PW_PARENT_JOB_DIR }}/dashboard
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for the dashboard endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: probe-${PW_RUN_SLUG}
          host: ${{ inputs.resource.ip }}
          skip_cleanups_file: ${{ env.PW_PARENT_JOB_DIR }}/dashboard/SKIP_CLEANUP
      - name: Release the dashboard runner
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - dashboard_runner

  admin_runner:
    needs:
      - setup
    working-directory: ${{ env.PW_PARENT_JOB_DIR }}/admin
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Serve the admin dashboard
        uses: github/parallelworks/workflows@canary
        early-cancel: any-job-failed
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ env.PW_PARENT_JOB_DIR }}/workflows/probe/app/start-dashboard.sh
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          rundir: ${{ env.PW_PARENT_JOB_DIR }}/admin
          scheduler: false
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ env.PW_PARENT_JOB_DIR }}/admin/SKIP_CLEANUP
          slurm:
            is_enabled: false
          pbs:
            is_enabled: false
      - name: Cancel the admin wait
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - admin_wait
      - name: Exit with error
        run: |
          echo "::error title=Error::The admin dashboard stopped before its endpoint came online"
          exit 1

  admin_wait:
    needs:
      - setup
    working-directory: ${{ env.PW_PARENT_JOB_DIR }}/admin
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for the admin endpoint
        early-cancel: any-job-failed
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/wait_for_endpoint/general.yaml
          endpoint_name: probe-admin-${PW_RUN_SLUG}
          host: ${{ inputs.resource.ip }}
          skip_cleanups_file: ${{ env.PW_PARENT_JOB_DIR }}/admin/SKIP_CLEANUP
      - name: Release the admin runner
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - admin_runner

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Host
        description: The user workspace, or a cluster login node with the pw CLI, python3 and git.
        include-workspace: true
        tooltip: |
          Where the dashboards run: the user workspace or the login node of a
          connected cluster with the pw CLI, python3 and git. Tests started from
          the admin dashboard are launched from here with the pw CLI.
      api_key:
        type: password
        label: API key
        description: Required on a cloud cluster; the dashboards use it after this run completes.
        tooltip: |
          A platform API key of yours (account settings, API keys). The dashboards
          keep calling the platform after this run completes, when the run's own
          credential stops working, and a cloud cluster has no credential of its
          own, so they need the key there. On the user workspace or a cluster
          connected through the ACTIVATE agent (existing or managed) the field is
          not shown: the agent keeps the resource signed in as you, and the
          dashboards authenticate with that sign-in.
        hidden: ${{ inputs.resource.provider == 'existing' || inputs.resource.provider == 'managed-cluster' || inputs.resource.name == 'user-workspace' }}
        ignore: ${{ .hidden }}
      tests:
        type: group
        label: Test definitions
        tooltip: Git repository, branch and directory of the test definition files.
        items:
          repo:
            type: string
            label: Repository
            default: https://github.com/parallelworks/probe-tests-activate-parallel-works.git
          branch:
            type: string
            label: Branch
            default: main
          directory:
            type: string
            label: Directory
            default: tests
            tooltip: |
              Every *.json file below this directory is a test definition. Only the
              ones whose platform and user match this run can be executed.
      results:
        type: group
        label: Results
        tooltip: |
          Where the results live. A bucket is restored into the run when it
          starts and pulled again by Refresh on the dashboard; a directory on
          the host is read and written in place and kept between runs.
        items:
          location:
            type: dropdown
            label: Location
            default: bucket
            description: A bucket is restored when the run starts; a directory on the host is read in place.
            options:
              - label: Bucket
                value: bucket
              - label: Local filesystem
                value: local
          bucket:
            type: bucket
            label: Bucket
            hidden: ${{ inputs.results.location != 'bucket' }}
            ignore: ${{ .hidden }}
          path:
            type: string
            label: Path in bucket
            default: probe/results
            hidden: ${{ inputs.results.location != 'bucket' }}
            ignore: ${{ .hidden }}
          directory:
            type: string
            label: Directory
            default: ${HOME}/pw/probe/results
            description: Absolute path on the host, created when missing; ${HOME} is the home directory there.
            hidden: ${{ inputs.results.location != 'local' }}
            ignore: ${{ .hidden }}
