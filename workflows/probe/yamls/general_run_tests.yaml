# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
# PROBE: runs tests once and exits. Every test's results go to the bucket, or to
# the directory on the host, as soon as it finishes. A failed test is a result,
# recorded and shown on the dashboard, so it is reported as a warning; the run
# ends in error only when PROBE could not run the tests or record their results.
# No endpoint. Setup is app/setup.sh, shared with general.yaml; the run is
# app/run-tests.sh.
permissions:
  - '*'
jobs:
  run:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: canary
          sparse_checkout:
            - workflows/probe/app
      - name: Set up
        run: |
          cd ${PW_PARENT_JOB_DIR}
          TESTS_REPO="${{ inputs.tests.repo }}" TESTS_BRANCH="${{ inputs.tests.branch }}" TESTS_DIR="${{ inputs.tests.directory }}" \
          RESULTS_LOCATION="${{ inputs.results.location }}" RESULTS_BUCKET_URI="${{ inputs.results.bucket.uri }}" \
          RESULTS_PATH="${{ inputs.results.path }}" RESULTS_DIRECTORY="${{ inputs.results.directory }}" RESTORE_RESULTS=false \
            bash workflows/probe/app/setup.sh
      - name: Run tests
        run: |
          cd ${PW_PARENT_JOB_DIR}
          cat > selection.txt <<'SELECTION'
          ${{ inputs.selection }}
          SELECTION
          bash workflows/probe/app/run-tests.sh
'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Host
        description: The user workspace, or a cluster login node with the pw CLI, python3 and git.
        include-workspace: true
        tooltip: |
          Where PROBE runs: the user workspace or the login node of a connected
          cluster with the pw CLI, python3 and git. Tests are launched from here
          with the pw CLI.
      selection:
        type: editor
        label: Tests to run
        default: all
        tooltip: |
          all, or test definition files relative to the tests directory, one per
          line or separated by spaces, e.g.
          activate.parallel.works/alvaro/webshell/gcp-controller.json
      tests:
        type: group
        label: Test definitions
        tooltip: Git repository, branch and directory of the test definition files.
        items:
          repo:
            type: string
            label: Repository
            default: https://github.com/parallelworks/probe-tests-activate-parallel-works.git
          branch:
            type: string
            label: Branch
            default: main
          directory:
            type: string
            label: Directory
            default: tests
      results:
        type: group
        label: Results
        tooltip: |
          Where the results go: every test's records and artifacts are uploaded
          to the bucket, or written to the directory on the host, as it finishes.
        items:
          location:
            type: dropdown
            label: Location
            default: bucket
            description: A bucket shared with the dashboards, or a directory on the host, kept between runs.
            options:
              - label: Bucket
                value: bucket
              - label: Local filesystem
                value: local
          bucket:
            type: bucket
            label: Bucket
            hidden: ${{ inputs.results.location != 'bucket' }}
            ignore: ${{ .hidden }}
          path:
            type: string
            label: Path in bucket
            default: probe/results
            hidden: ${{ inputs.results.location != 'bucket' }}
            ignore: ${{ .hidden }}
          directory:
            type: string
            label: Directory
            default: ${HOME}/pw/probe/results
            description: Absolute path on the host, created when missing; ${HOME} is the home directory there.
            hidden: ${{ inputs.results.location != 'local' }}
            ignore: ${{ .hidden }}
