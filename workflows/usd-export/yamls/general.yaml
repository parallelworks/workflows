# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
# Exports simulation results to an OpenUSD stage for Omniverse: every solved case under
# the results directory becomes a design file, and study.usda references them all on a
# grid with a legend and a field switch, and flow.usda animates the flow around one
# design in 3D. The omniverse workflow's desktop, given either file, reloads it as it
# changes, so designs appear while the export runs. A batch job: preprocessing checks the form, installs the exporter's Python once
# and writes export.sh; the submitter runs it on the login node or a SLURM/PBS node; the
# run fails when the export does.
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflows.git
          branch: omniverse-usd-export
          sparse_checkout:
            - workflows/usd-export/app
            - tools/utils
      - name: Create Inputs
        run: |
          set -x
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          cat <<'EOF' >> inputs.sh
          results_source="${{ inputs.results.source }}"
          results_format="${{ inputs.results.format }}"
          results_follow_minutes="${{ inputs.results.follow_minutes }}"
          stage_directory="${{ inputs.stage.directory }}"
          stage_columns="${{ inputs.stage.columns }}"
          stage_flow="${{ inputs.stage.flow }}"
          service_parent_install_dir="${{ inputs.software.install_dir }}"
          EOF
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          sed -i 's/^/export /' inputs.sh
          cat <<'EOF' > python-load.txt
          ${{ inputs.software.python_load }}
          EOF
      - name: Prepare the Export
        run: software_python_load="$(cat python-load.txt)" bash workflows/usd-export/app/prepare.sh

  export:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Export to USD
        uses: github/parallelworks/workflows@canary
        with:
          $yaml: workflows/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.resource }}
          rundir: ${{ env.PW_PARENT_JOB_DIR }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: false
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
      - name: Report
        run: EXIT_FILE="${{ needs.preprocessing.outputs.EXIT_FILE }}" STAGE_FILE="${{ needs.preprocessing.outputs.STAGE_FILE }}" bash workflows/usd-export/app/report.sh

'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Compute resource
        include-workspace: false
        tooltip: The cluster whose file system holds the results; the export runs on its login node or a compute node
      cluster:
        hidden: ${{ inputs.resource.schedulerType == '' }}
        ignore: ${{ inputs.resource.schedulerType == '' }}
        type: group
        label: Compute cluster settings
        items:
          scheduler:
            type: boolean
            default: false
            label: Submit to the scheduler
            description: Otherwise the job runs on the login node.
          slurm:
            type: group
            label: SLURM directives
            hidden: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.resource }}
              time:
                label: Walltime
                description: HH:MM:SS, or D-HH:MM:SS for runs over a day.
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
              scheduler_directives:
                type: editor
                label: Scheduler directives
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
          pbs:
            type: group
            label: PBS directives
            hidden: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler directives
                type: editor
                optional: true
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l walltime=01:00:00
      results:
        type: group
        label: Results
        items:
          source:
            type: string
            label: Results directory
            description: One case directory, or a directory of cases such as a doe-openfoam run's cases directory.
            tooltip: |
              Searched four levels down for case directories (a case/case.foam, or a params.in).
              A doe-openfoam run leaves its cases in ~/pw/jobs/<workflow>/<run>/cases, a
              dakota-openfoam run in its state directory. A case is exported once it has a
              results.out; a case the solver failed is skipped.
          format:
            type: dropdown
            label: Format
            default: openfoam-naca
            options:
              - value: openfoam-naca
                label: OpenFOAM airfoil cases (openfoam-naca, doe-openfoam, dakota-openfoam)
            tooltip: The mid plane around the airfoil (velocity, pressure, eddy viscosity), the airfoil colored by its pressure coefficient, and streamlines.
          follow_minutes:
            type: number
            label: Keep exporting new cases for
            description: Minutes without a newly finished case before the export ends; 0 exports what is there now and ends.
            default: 0
            min: 0
            max: 1440
            step: 1
            tooltip: Set it when the study is still running, so cases appear in the desktop as they finish. A doe-openfoam study ends the export early, once its results.csv exists and every case has finished. Submitted to the scheduler, the export must also fit inside the walltime.
      stage:
        type: group
        label: Stage
        items:
          directory:
            type: string
            label: Stage directory
            default: ${HOME}/pw/omniverse/stages/study
            description: study.usda and the design files go here; give the same directory to the omniverse desktop.
            tooltip: Designs already in the directory are kept, and a case exported again replaces its design, so several exports can fill one study.
          columns:
            type: number
            label: Designs per row
            default: 4
            min: 1
            max: 32
            step: 1
          flow:
            type: string
            label: Animated flow design
            default: best
            description: The design flow.usda shows in 3D with tracer particles; best is the highest lift to drag ratio, none writes no flow.usda.
            tooltip: |
              Or a design name as the study shows it (case_3, iter_2/case_1). With best,
              flow.usda moves to a better design as one is exported. Give
              <stage directory>/flow.usda to the omniverse desktop as its stage.
      software:
        type: group
        label: Software
        collapsed: true
        items:
          python_load:
            type: editor
            label: Python environment commands
            optional: true
            description: Empty installs Python with OpenUSD 25.11, VTK, NumPy and Pillow under the install directory once (about 2 minutes).
            tooltip: Commands that put a python on PATH with pxr (OpenUSD 25.11, the release Isaac Sim 6.2 reads), vtk, numpy and PIL.
          install_dir:
            type: string
            label: Install directory
            default: ${HOME}/pw/software
